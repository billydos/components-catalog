openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: components-catalog REST API
  version: 0.1.0
  description: |
    Встраиваемый справочник электронных компонентов. REST `/api/v1`
    работает как тонкий транспорт над сервисным слоем Go-библиотеки.
    Аутентификация, авторизация и лимитирование остаются на стороне
    сайта, монтирующего хендлер. Защищённые маршруты сайт выбирает сам.
    Транспорт: JSON, UTF-8.

    Ошибки описываются моделью `{"code", "message"}`. Поле `code`
    содержит машиночитаемую строку латиницей snake_case. Поле
    `message` несёт текст из каталога сообщений модуля на языке
    запроса: английский — канонический язык каталога, русский —
    бандл. Язык выбирается заголовком `Accept-Language`.

    Статусы ответов:

    - `400`: неверный запрос;
    - `404`: не найдено; неизвестный маршрут даёт `404` с кодом
      `api_route_not_found` в той же модели ошибок;
    - `405`: метод не поддерживается маршрутом, заголовок `Allow`
      перечисляет допустимые методы;
    - `409`: конфликт;
    - `422`: семантическая ошибка записи;
    - `500`: внутренняя ошибка.

    Локализация. База модуля языконезависима: кодовые поля ответов
    (`kind`, `system`, `unit`, `parameter`, `attribute`, `section`)
    всегда канонические. Отображаемые поля (`name`, `kind_name`,
    `system_name`, описания, имена и символы единиц в `/catalog`)
    заполняются из бандлов модуля на языке запроса. Язык определяется
    заголовком `Accept-Language` (q-значения, базовый подтег);
    поддерживаются `en` и `ru`, язык по умолчанию и запасной для
    неподдерживаемых — `en`.

    Секции тела записи (`attributes`, секции групп, `manufacturers`,
    `variants`, `analogs`, `synonyms`, `sources`) изменяются по единым
    правилам:

    - секция не задана или равна `null`: данные остаются без изменений;
      при создании записи это означает «не задано»;
    - заданная секция заменяется целиком;
    - пустая секция (`[]` либо `{}`) очищает данные;
    - ошибка хотя бы в одном значении отменяет всю запись: частичного
      применения не существует.

    Секция `sources` ссылается на коды глобального реестра источников.
    Реестр хранит библиографические определения, общие для всех
    записей. Вводят их корневая секция `sources` файла импорта и
    запрос `POST /api/v1/sources`, а не тело записи.
servers: []
tags:
  - name: catalog
    description: Справочники модуля (классы, каталог).
  - name: components
    description: "Записи приборов: поиск, карточка, создание, обновление, удаление."
  - name: sources
    description: "Реестр источников данных записей: чтение, применение, удаление."
  - name: service
    description: Служебные данные (статистика, автодополнение).
  - name: import
    description: "Импорт файлов наполнения: поток NDJSON."
paths:
  /api/v1/kinds:
    get:
      tags: [catalog]
      operationId: kinds
      summary: Классы приборов
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Классы приборов. Поле `name` заполняется по
            локали запроса.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KindsResponse"}
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/catalog:
    get:
      tags: [catalog]
      operationId: catalog
      summary: Снимок каталога
      description: |
        Параметры, атрибуты, условия, единицы, группы, системы
        обозначений и семейства — всё, что нужно для построения форм
        и фильтров. Отдельно снимок отдаёт словари значений словарных
        полей обозначения: `material`, `subclass`, `adjustment`
        и `category`.

        Ключи полей повторяют формат наполнения: `snake_case` по
        колонкам каталожных таблиц. Отображаемые строки (`name`,
        описания, имена и символы единиц) заполняются по локали
        запроса.

        `ETag` вычисляется по `catalog_revision` и локали
        представления: разные локали дают разные `ETag` (RFC 9110).
        Снимок кэшируется до смены каталога.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Снимок каталога.
          headers:
            ETag:
              description: Сильный `ETag` вида "catalog-<catalog_revision>-<локаль>".
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogSnapshot"}
        "304":
          description: Снимок не менялся (проверка по `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/stats:
    get:
      tags: [service]
      operationId: stats
      summary: Статистика модуля либо агрегаты параметров класса
      description: |
        Без параметра `kind` возвращаются агрегаты модуля: количество
        записей по классам, версия схемы и ревизии.

        С параметром `kind` возвращаются фасетные агрегаты значений
        параметров класса. Численные параметры дают `min`/`max` —
        границы для слайдеров параметрических фильтров. Текстовые
        и enum-параметры дают частоты значений. Частота — это число
        записей класса, у которых встречается значение: значение
        в данных типа и в нескольких исполнениях одной записи
        считается один раз.

        Границы считаются по семантике фильтров поиска
        (`value_min`/`value_max` и `value_exact`): `at_least` даёт
        только `min`, `at_most` — только `max`, `limits` — `min` и/или
        `max` по заданным границам.

        В агрегаты входят данные типа в целом и данные исполнений —
        как у фильтров поиска. Параметры без данных в классе в ответ
        не входят. Не входят и неприменимые к классу: применимость —
        данные каталога, поэтому в ответе могут отсутствовать и
        параметры, у которых остались данные после изменения
        применимости каталогом.

        Порядок параметров — алфавит кодов, как в `/catalog`. Значения
        упорядочены по убыванию частоты, затем по тексту.

        Фасетное представление кэшируется. `ETag` вычисляется по
        `catalog_revision` (применимость параметров), `data_revision`,
        классу и локали. `If-None-Match` отсекается `304` до
        агрегатного чтения.

        Повтор распознаваемого параметра, посторонний ключ запроса
        и неизвестный класс завершаются ошибкой `400`
        `validation_failed`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: kind, in: query, schema: {type: string}, description: "Код класса. С параметром ответ содержит фасетные агрегаты значений параметров этого класса. Без параметра и при пустом значении возвращаются агрегаты модуля."}
      responses:
        "200":
          description: |
            Агрегаты модуля либо фасетные агрегаты класса.

            Без `kind` ответ не несёт `ETag`: подсчёт дешёвый, ревизии
            возвращаются в самом ответе. С `kind` ответ снабжается
            `ETag`. Поле `name` заполняется по локали запроса, а `unit`
            содержит канонический код.
          headers:
            Vary:
              description: |
                Ставится только на ответе с `kind`: представление
                локализуется. На агрегатах модуля без `kind`
                не отдаётся.
              schema: {type: string, const: Accept-Language}
            ETag:
              description: |
                Сильный `ETag` вида
                "stats-<catalog_revision>-<data_revision>-<kind>-<локаль>";
                ставится только на фасетном ответе с `kind`.
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Stats"
                  - $ref: "#/components/schemas/ParameterStats"
        "304":
          description: |
            Фасетные агрегаты не менялись (проверка по
            `If-None-Match`). Ответ отдаётся только с `kind`.
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/changes:
    get:
      tags: [service]
      operationId: changes
      summary: Поток событий изменений записей (change feed)
      description: |
        Поток событий изменений записей для инкрементальной
        синхронизации производных индексов сайта. Каждое событие
        описывает применённую операцию над записью: `created`/
        `updated`/`deleted`, класс, обозначение и стабильный id
        записи. События упорядочены по возрастанию id события.

        События записываются той же транзакцией, что меняет данные,
        поэтому событие и изменение атомарны. Исход `Skipped` событий
        не оставляет. Компенсационные удаления импортёра дают обычное
        событие `deleted`.

        Курсором служит параметр `after` — id последнего полученного
        события. Значение `after=0` читает поток с начала. Ревизия курсором
        быть не может: её связь с событиями — деталь пути записи (в
        одной транзакции возможны несколько событий, а инкремент может
        пройти без события). Id присваивается вставкой и остаётся
        плотным монотонным курсором.

        Ответ содержит текущую `data_revision`, согласованную со
        страницей событий. Поток покрывает только изменения данных
        (`data_revision`). Изменения каталога (`catalog_revision`)
        в поток не входят: для них используется `ETag` запроса
        `GET /catalog`.

        События не содержат акторов и состояний до/после: это не
        аудит, история изменений остаётся зоной сайта. Автоматической
        ретенции нет: рост ограничен масштабом редактирования, очистка
        выполняется вручную SQL, REST-пути очистки нет.

        Повтор распознаваемого параметра и посторонний ключ запроса
        завершаются ошибкой `400` `validation_failed`.
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}, description: "Курсор: id последнего полученного события. 0 читает поток с начала."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}, description: "Число событий страницы (≤ 1000)."}
      responses:
        "200":
          description: Страница событий и текущая `data_revision`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangesResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components:
    get:
      tags: [components]
      operationId: components_list
      summary: Поиск записей
      description: |
        Поиск записей: подстрока обозначения, система, набор
        стабильных id, фильтры полей, атрибутов и параметров,
        сортировка, пагинация. Ответ — список записей с обозначением,
        классом, системой и ключевыми полями.

        `ETag` вычисляется по `data_revision`, канонической строке
        запроса и локали представления: разные фильтры, сортировки или
        локали дают разные `ETag` (RFC 9110).

        Повтор любого параметра запроса завершается ошибкой `400`
        `validation_failed`. Исключения — намеренно повторяемые
        параметры:

        - `id` — набор фильтра, до 200 значений;
        - словарные фильтры `material`/`subclass`/`adjustment`/
          `category` — мультивыбор с семантикой ИЛИ внутри поля;
        - `values` — колонки значений строк выдачи.

        Помимо параметров, описанных выше, запрос допускает:

        - фильтры полей обозначения: код поля служит именем параметра.
          Текстовые поля: `material`, `subclass`, `letters`,
          `construction`, `prefix`, `family`, `series`, `adjustment`,
          `category`, `base`. Числовые поля со сравнением на
          равенство: `junctions`, `group`, `dev_number`, `assembly`,
          `feature`, `modification`, `chip`;
        - словарные поля (`material`, `subclass`, `adjustment`,
          `category`) принимают стабильный код словаря либо
          отображаемое название локали. Значение канонизируется.
          Словарные поля повторяемы: каждое значение канонизируется
          отдельно, набор имеет семантику ИЛИ, а дубликат
          канонического кода завершается ошибкой `400`
          `validation_failed`;
        - допустимые коды словарей:
          - `material`: `si`, `ge`, `ga`, `in`, `sic`, `other`, `gaas`;
          - `subclass`: `bjt`, `zener`, …;
          - `adjustment`: `fixed`, `variable`, `preset`;
          - `category`: коды словаря каталога из секции `dictionaries`
            ответа `GET /catalog`;
        - поле `base` задаёт базовое обозначение записи. Значение
          канонизируется как обозначение;
        - прочие текстовые поля — нормативные элементы обозначения.
          Для записей `other` поле `series` задаётся секцией `fields`;
        - `attr.<код>=<значение>` — фильтр по атрибуту: текст либо
          число по типу атрибута. Логические атрибуты не фильтруются.
          Текстовый фильтр атрибута `text_list` сравнивается с любым
          элементом списка;
        - границы численного параметра: `par.<код>.min=`,
          `par.<код>.max=`, `par.<код>.exact=`;
        - текст либо enum: `par.<код>.text=` либо `par.<код>=<текст>`.

        Вариантные параметрические фильтры применяются в пределах
        одного исполнения. Фильтр по параметру или атрибуту,
        неприменимому к классу запроса, завершается ошибкой `400`
        `parameter_not_applicable`/`attribute_not_applicable`.
        Неизвестный параметр запроса даёт `400` `validation_failed`.
      parameters:
        - {name: kind, in: query, schema: {type: string}, description: "Класс приборов (transistor, diode, resistor, capacitor, relay)."}
        - {name: system, in: query, schema: {type: string}, description: "Система обозначений (gost, ost, pro, jedec, jis, other)."}
        - {name: q, in: query, schema: {type: string}, description: "Подстрока обозначения либо исторического названия записи (синонима). Регистр не важен."}
        - name: id
          in: query
          description: |
            Фильтр по набору стабильных id записей. Параметр намеренно
            повторяемый. Допустимо до 200 значений, каждое — целое
            положительное число. Дубликат значения завершается
            ошибкой `400` `validation_failed`.

            Семантика фильтра — пересечение с прочими фильтрами. Id
            без записи или id, отсечённый другими фильтрами, просто
            не даёт строки в выдаче: отдельной ошибки нет. Без `sort`
            выдача упорядочивается по порядку передачи id. С `sort`
            применяется заданная сортировка.

            Сценарий: составной поиск «внешний отбор сайта ×
            параметрика модуля» без дублирования каталога.
          schema:
            type: array
            items: {type: integer, format: int64, minimum: 1}
            minItems: 1
            maxItems: 200
            uniqueItems: true
          style: form
          explode: true
        - name: values
          in: query
          description: |
            Колонки значений строк выдачи. Параметр намеренно
            повторяемый. Значение — код параметра каталога либо
            `attr.<код атрибута>`, до 16 кодов. Дубликат завершается
            ошибкой `400` `validation_failed`.

            Для каждого кода, присутствующего у записи, выдаётся
            элемент схемы `CardValue` (нет значения — нет элемента),
            в порядке запроса. Поле `name` заполняется по локали
            запроса, `unit` содержит канонический код единицы.
            Условия `conditions` бывают только у параметров.

            Правило выбора значения при нескольких строках у записи
            (данные типа плюс исполнения): численные параметры дают
            агрегат границ MIN/MAX — одиночная строка сохраняет форму
            `exact`/`at_least`/`at_most`/`limits`. Текстовые и
            enum-параметры берут данные типа поверх исполнений.

            Логические атрибуты дают `400` `validation_failed`.
            Неизвестный код завершается ошибкой `400`
            `unknown_parameter`/`unknown_attribute`. Неприменимый
            к классу запроса — ошибка `400`
            `parameter_not_applicable`/`attribute_not_applicable`,
            как у фильтров.
          schema:
            type: array
            items: {type: string, minLength: 1}
            minItems: 1
            maxItems: 16
          style: form
          explode: true
        - name: sort
          in: query
          schema: {type: string}
          description: |
            Ключи сортировки перечисляются через запятую. Знак `-`
            перед ключом задаёт убывание. Допустимы `designation`,
            `id`, код поля разбора
            либо код числового параметра каталога, применимого
            к классу запроса. Параметры `text`/`enum` и неприменимые
            к классу дают `400` (`validation_failed`/
            `parameter_not_applicable`).

            Значение записи по параметру выбирается по направлению
            сортировки. При возрастании берётся нижняя граница
            (`value_min`, точное значение или единственная верхняя),
            при убывании — верхняя (`value_max`, точное или
            единственная нижняя). Учитываются значения типа
            и исполнений, как в фильтрах. Записи без значения
            ставятся в конец независимо от направления. К любому
            порядку добавляется финальная сортировка по (`kind`,
            `designation`).
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Размер страницы (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Смещение страницы."}
      responses:
        "200":
          description: Страница результатов.
          headers:
            ETag:
              description: |
                Сильный `ETag` вида "data-<data_revision>-<hash>-<локаль>".
                `hash` — хэш канонической строки запроса: имена
                параметров отсортированы, пары `name=value` соединяются
                через «&». Повторяемый `id` входит каждым значением,
                порядок значим.
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchPage"}
        "304":
          description: Данные не менялись (проверка по `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [components]
      operationId: components_create
      summary: Создание записи
      description: |
        Тело запроса — запись наполнения: строка-обозначение либо
        объект «name/system + секции». Класс записи определяется
        автодетектом по обозначению. Для системы `other` создание
        выполняется запросом `PUT` с классом в пути.

        Пара (`kind`, `designation`), уже существующая в базе, даёт
        `409` `already_exists` без изменения записи. Создание
        атомарно: гонка параллельных `POST` не применяет секции к
        чужой записи.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "201":
          description: Запись создана.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            Редкая гонка: запись удалена между применением и чтением
            карточки для ответа.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/id/{id}:
    get:
      tags: [components]
      operationId: components_by_id
      summary: Карточка по стабильному id
      description: |
        Обозначения, содержащие `/` (MIL-имена), адресуются этим путём
        или поиском: прямой путь для них не гарантируется.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Карточка записи.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/{kind}/{designation}:
    get:
      tags: [components]
      operationId: components_get
      summary: Карточка записи
      description: |
        Карточка записи: обозначение, система и поля разбора,
        атрибуты, значения параметров по группам с условиями,
        исполнения-варианты (матрица «номинал × напряжение →
        габариты/масса»), аналоги — исходящие и встречные,
        производители. Обозначение в пути URL-кодируется.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Карточка записи.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [components]
      operationId: components_put
      summary: Upsert записи с семантикой секций
      description: |
        Тело запроса — запись наполнения: `name`/`system` и секции.
        Поле `name` обязано совпадать с `designation` пути, иначе
        запрос завершается ошибкой `422` `designation_mismatch`.
        Класс задаётся путём и переопределяет автодетект — так
        создаются записи системы `other`.

        Исходы применения:

        - `Added` — запись создана;
        - `UpdatedExisting` — запись обновлена;
        - `Skipped` — слитое состояние совпадает с текущим: записи
          в БД и инкремента ревизий нет.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "200":
          description: Запись применена.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            Редкая гонка: запись удалена между применением и чтением
            карточки для ответа.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [components]
      operationId: components_delete
      summary: Удаление записи (каскад)
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Запись удалена.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources:
    get:
      tags: [sources]
      operationId: sources_list
      summary: Страница реестра источников
      description: |
        Реестр источников данных записей — глобальный реестр
        библиографических определений, общий для всех записей.
        Ответ упорядочен по коду. Доступны пагинация и поиск
        подстрокой по коду либо названию.

        Поиск регистронезависим, с оговоркой по диалектам: postgres
        сворачивает регистр всех алфавитов, sqlite — только латиницу,
        поэтому кириллические названия на sqlite ищутся в точном
        регистре. Лица (авторы и редакторы) и ссылки читаются только
        по строкам страницы.

        `ETag` вычисляется по `data_revision`, канонической строке
        запроса и локали представления, как у `GET /components`.
        Изменение реестра двигает `data_revision`. Повтор
        распознаваемого параметра и посторонний ключ запроса
        завершаются ошибкой `400` `validation_failed`. Полное чтение
        реестра остаётся форматом экспорта (Go API `ListSources`),
        не REST.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: q, in: query, schema: {type: string}, description: "Подстрока по коду либо названию источника; без `q` отдаётся весь реестр постранично."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Размер страницы (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Смещение страницы."}
      responses:
        "200":
          description: Страница реестра. Поле `type_name` заполняется
            по локали запроса.
          headers:
            ETag:
              description: |
                Сильный `ETag` вида "data-<data_revision>-<hash>-<локаль>":
                `hash` — хэш канонической строки запроса, как у поиска.
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesPage"}
        "304":
          description: Данные не менялись (проверка по `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [sources]
      operationId: sources_apply
      summary: Применение определений источников
      description: |
        Тело запроса — массив определений в форме корневой секции
        `sources` файла импорта. Поля `code`/`title`/`type` обязательны.
        Читатель формата тот же, поэтому дубликаты ключей и неизвестные
        поля отвергаются.

        Применение работает как upsert по коду: существующее
        определение обновляется, лица и ссылки замещаются целиком.
        Валидацию значений выполняет сервисный слой: charset кода,
        словарь типов `source_types`, границы года 1900–2100, повторы
        в списках.

        Ответ `{applied}` отражает фактическое изменение реестра.
        Повторное применение без изменений даёт `false` и не двигает
        `data_revision` — идемпотентность, как у импорта.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              items: {$ref: "#/components/schemas/SourceDef"}
      responses:
        "200":
          description: |
            Итог применения: изменение либо идемпотентный повтор
            без изменений.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesApplyResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources/{code}:
    get:
      tags: [sources]
      operationId: sources_get
      summary: Определение источника по коду
      description: |
        Полное библиографическое определение. Поле `type_name`
        локализуется. В отличие от секции `sources` карточки — без
        заметки места.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Определение источника. Поле `type_name`
            заполняется по локали запроса.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceDef"}
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [sources]
      operationId: sources_delete
      summary: Удаление источника без ссылок
      description: |
        Источник, на который ссылаются записи (секция `sources`
        записи), не удаляется: запрос завершается ошибкой `409`
        `source_in_use`. Ссылки — данные записей, каскада нет. Чтобы
        удалить источник, снимите ссылки заменой секций записей;
        замена секции и удаление записи чистят осиротевшие источники
        автоматически.

        Удаление атомарно. Оно инкрементирует `data_revision` без
        событий потока — это изменение реестра, как у применения
        определений.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Источник удалён. Лица и ссылки удаляются
            каскадом.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/suggest:
    get:
      tags: [service]
      operationId: suggest
      summary: Автодополнение по префиксу обозначения
      description: |
        Автодополнение отключается конфигурацией модуля: хендлер не
        монтируется, отключённый маршрут даёт `404`. Повтор
        распознаваемого параметра и посторонний ключ запроса
        завершаются ошибкой `400` `validation_failed` — опечатки
        не молчат.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}, description: "Префикс обозначения либо исторического названия записи (синонима)."}
        - {name: kind, in: query, schema: {type: string}, description: "Класс приборов."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        "200":
          description: Подсказки.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SuggestResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/parse:
    get:
      tags: [service]
      operationId: parse
      summary: Разбор обозначения
      description: |
        Разбор обозначения выполняется теми же строгими
        грамматиками, что и команда `parse` CLI.

        Без параметра `system` действует автодетект с фиксированным
        порядком: полупроводник `gost` → `pro` → `jedec` → `jis`,
        резистор `gost`/`ost`, конденсатор `gost`. С параметром
        `system` разбор идёт в явно заданной системе. Для `other` класс
        `kind` обязателен, иначе запрос завершается ошибкой `400`
        `kind_ambiguous`.

        Обозначение канонизируется: регистр, пробелы и типографские
        дефисы не важны. Параметры `system`/`kind` переопределяют
        автодетект. Противоречие даёт `400` `designation_mismatch`.

        Ответ содержит класс, систему, каноническое обозначение, поля
        разбора и кандидатов. Кандидаты — все успешные строгие разборы
        в порядке автодетекта, без дублей пары класс/система. При
        автодетекте первый кандидат совпадает с основным результатом.
        Числового «конфиденса» у строгих грамматик нет: перечень
        кандидатов и есть эквивалент.

        Повтор любого распознаваемого параметра и посторонний ключ
        запроса завершаются ошибкой `400` `validation_failed` —
        опечатки не молчат.
      parameters:
        - {name: designation, in: query, required: true, schema: {type: string}, description: "Обозначение (канонизируется)."}
        - {name: system, in: query, schema: {type: string, enum: [gost, ost, pro, jedec, jis, other]}, description: "Система обозначений. Без параметра действует автодетект."}
        - {name: kind, in: query, schema: {type: string}, description: "Класс приборов: переопределяет автодетект, обязателен для `system=other`."}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Разбор обозначения с кандидатами строгих систем.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParseResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/import:
    post:
      tags: [import]
      operationId: import
      summary: Импорт файла наполнения (NDJSON, jsonc, yaml)
      description: |
        Тело запроса — файл наполнения. Формат задаётся обязательным
        заголовком `Content-Type`:

        - `application/x-ndjson` — поток NDJSON: одна JSON-строка —
          одна сущность, строки-обёртки `{"<класс>": <запись>}`, блок
          `catalog` — строками-подразделами до записей. Поток читается
          построчно, без загрузки тела целиком и без потолка размера
          запроса. Память ограничена потолком одной строки (16 МиБ).
          Для больших объёмов предназначен именно NDJSON;
        - `application/json` — документ jsonc, комментарии допустимы;
        - `application/yaml` — документ yaml. Оба документа читаются
          целиком с потолком тела 16 МиБ. Превышение даёт `400`
          `invalid_import_file`.

        Отсутствующий и неподдерживаемый `Content-Type` завершается
        ошибкой `400` `validation_failed`. Параметры заголовка
        `Content-Type` (например, charset) допускаются и игнорируются.

        Ответ — синхронный отчёт после EOF: счётчики исходов и полный
        список проблем прогона. Модель `Issues`: корректные записи
        применяются целиком, записи с ошибками не применяются вовсе.
        Код `200` возвращается и для прогонов с проблемами. Жёсткая
        ошибка только одна: синтаксис формата и чтение потока дают
        `400` `invalid_import_file`.

        Запрос принимает единственный параметр `dry_run`. Со значением
        `true` импорт идёт как контрольный прогон: конвейер проверок
        тот же, в БД ничего не пишется, отчёт помечается признаком
        `dry_run`. Значение должно быть строго `true` либо `false`;
        любое другое значение, повтор параметра и прочие ключи запроса
        завершаются ошибкой `400` `validation_failed`.

        Прогресс по REST не отдаётся: запрос синхронный, наблюдение
        прогона — хук метрик сайта. Запись монтируется сайтом только
        в защищённые маршруты.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: dry_run, in: query, schema: {type: boolean, enum: [true, false], default: false}, description: "Контрольный прогон без записи в БД. Значение должно быть строго `true` либо `false`."}
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: |
                Поток NDJSON — по одной JSON-строке на сущность;
                потолка размера запроса нет.
          application/json:
            schema:
              type: string
              description: Документ jsonc, комментарии `//` допустимы.
                Тело читается целиком, потолок 16 МиБ.
          application/yaml:
            schema:
              type: string
              description: Документ yaml. Тело читается целиком,
                потолок 16 МиБ.
      responses:
        "200":
          description: Отчёт прогона импорта. Тексты проблем
            (`message`) выдаются по локали запроса.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportReport"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  headers:
    VaryLanguage:
      description: |
        Всегда `Accept-Language`: представление ответа выбирается по
        локали запроса. Кэш обязан различать представления разных
        локалей (RFC 9110/9111).
      schema: {type: string, const: Accept-Language}
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      description: Код класса приборов.
      schema: {type: string}
    Designation:
      name: designation
      in: path
      required: true
      description: URL-кодированное обозначение.
      schema: {type: string}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: "Локаль отображаемых строк ответа: q-значения и базовый подтег. Поддерживаются `en` и `ru`, по умолчанию `en`."
      schema: {type: string, examples: ["ru", "en-US,en;q=0.8"]}
  responses:
    BadRequest:
      description: Неверный запрос (параметры/путь/синтаксис тела).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Не найдено.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Конфликт (запись уже существует).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: Метод не поддерживается маршрутом. Заголовок `Allow`
        перечисляет допустимые методы.
      headers:
        Allow:
          description: Разделённый запятыми список допустимых методов
            маршрута.
          schema: {type: string}
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: Семантическая ошибка записи/обозначения.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Внутренняя ошибка.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код (латиница snake_case).
          examples: [validation_failed]
        message:
          type: string
          description: Текст сообщения по локали запроса
            (`Accept-Language`). Английский — канонический.
    KindDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KindsResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
    Field:
      type: object
      required: [name]
      properties:
        name: {type: string}
        text: {type: string}
        num: {type: number}
    FieldValueDef:
      type: object
      description: |
        Значение словарного поля обозначения. Поле `code` —
        стабильный код: значение фильтров и секции `fields`. Поле
        `name` — отображаемое название по локали запроса.
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    FieldDictionaries:
      type: object
      description: |
        Словари значений словарных полей обозначения задают состав
        мультивыборных фильтров. Словари `material`/`subclass`/
        `adjustment` — константные реестры домена. Словарь `category`
        — словарь данных каталога, расширяется импортом. Расширения без
        записи в бандле отображаются кодом. Порядок значений
        стабилен: реестры домена и строки снимка.
      required: [material, subclass, adjustment, category]
      properties:
        material:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        subclass:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        adjustment:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        category:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
    Condition:
      type: object
      required: [condition, value]
      properties:
        condition: {type: string, description: Код условия измерения.}
        value: {type: number}
    CardAttribute:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        text: {type: string}
        texts:
          type: array
          description: Список заметок атрибута типа `text_list` в
            порядке наполнения. У скалярных атрибутов опускается.
          items: {type: string}
        num: {type: number}
        bool: {type: boolean}
    CardValue:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Код канонической единицы.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardGroup:
      type: object
      required: [code, section, name, values]
      properties:
        code: {type: string}
        section: {type: string, description: Имя секции файла наполнения.}
        name: {type: string}
        values:
          type: array
          description: Значения идут в каноническом порядке каталога
            (`sort_order` параметра). Одноимённые строки одного
            параметра — в порядке наполнения.
          items: {$ref: "#/components/schemas/CardValue"}
    CardVariant:
      type: object
      required: [label, attributes, groups]
      properties:
        label: {type: string}
        attributes:
          type: array
          description: Атрибуты исполнения — конструктивные признаки.
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
    CardTypeSibling:
      type: object
      required: [id, system, designation]
      properties:
        id: {type: integer, format: int64}
        system: {type: string}
        designation: {type: string}
    CardTypeValue:
      type: object
      required: [designation]
      properties:
        designation: {type: string, description: Обозначение записи группы типа.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardTypeDiff:
      type: object
      required: [parameter, name, values]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Код канонической единицы.}
        values:
          type: array
          description: Значения по записям группы. У записи без
            значения параметра ячейки нет.
          items: {$ref: "#/components/schemas/CardTypeValue"}
    CardTypeGroup:
      type: object
      required: [base, siblings, diffs]
      properties:
        base: {type: string, description: Базовое обозначение (тип): обозначение без буквы классификации и хвостовых элементов.}
        siblings:
          type: array
          description: Соседние записи того же класса с тем же типом.
          items: {$ref: "#/components/schemas/CardTypeSibling"}
        diffs:
          type: array
          description: Мини-матрица различий — параметры, значения
            которых различаются между записями группы (по данным типа
            в целом).
          items: {$ref: "#/components/schemas/CardTypeDiff"}
    CardLink:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        note: {type: string}
    CardSynonym:
      type: object
      required: [designation]
      description: |
        Историческое название записи (синоним): обозначение, под
        которым компонент выпускался в другие годы (С5-35 = ПЭВ).
        Заметка хранит происхождение имени, годы — период его
        употребления.
      properties:
        designation: {type: string}
        note: {type: string}
        year_from: {type: integer}
        year_to: {type: integer}
    CardSource:
      description: |
        Источник данных записи: книга, справочник, даташит, стандарт,
        ТУ, статья либо веб-страница. Библиографические тексты не
        локализуются. Поле `type_name` — отображаемое название типа
        по локали (`sourcetype.<код>`).
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      properties:
        code: {type: string}
        title: {type: string}
        type: {type: string}
        type_name: {type: string}
        authors:
          description: Авторы, порядок значим.
          type: array
          items: {type: string}
        editors:
          description: Редакторы/составители, порядок значим.
          type: array
          items: {type: string}
        year: {type: integer}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string}
        urls:
          description: |
            Ссылки на документацию: оригинал, зеркала, архивные
            копии. Первый элемент предпочитаемый.
          type: array
          items: {type: string}
        note:
          description: Место в источнике («таблица 5.3», «с. 214»).
          type: string
    Card:
      type: object
      required: [id, kind, kind_name, system, system_name, designation, fields, attributes, groups, variants, manufacturers, analogs, backlinks, synonyms, sources]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        kind_name: {type: string}
        system: {type: string}
        system_name: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
        variants:
          type: array
          items: {$ref: "#/components/schemas/CardVariant"}
        type_group:
          description: Группа типа. Опускается, когда соседних записей
            того же базового обозначения нет.
          allOf: [{$ref: "#/components/schemas/CardTypeGroup"}]
        manufacturers:
          type: array
          items: {type: string}
        analogs:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        backlinks:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        synonyms:
          type: array
          items: {$ref: "#/components/schemas/CardSynonym"}
        sources:
          description: |
            Источники данных записи: полное библиографическое
            определение и заметка места в источнике. Порядок
            канонический, по коду.
          type: array
          items: {$ref: "#/components/schemas/CardSource"}
    Outcome:
      type: string
      enum: [Added, UpdatedExisting, Skipped]
    UpsertResponse:
      type: object
      required: [outcome, card]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        card: {$ref: "#/components/schemas/Card"}
    SearchItem:
      type: object
      required: [id, kind, system, designation, fields]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        values:
          type: array
          description: Значения запрошенных колонок (параметр `values`)
            в порядке запроса. По каждому коду, присутствующему у
            записи, выдаётся элемент схемы `CardValue` (нет значения —
            нет элемента).
          items: {$ref: "#/components/schemas/CardValue"}
    SearchPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SearchItem"}
        total: {type: integer, description: Общее число записей под фильтрами.}
        limit: {type: integer}
        offset: {type: integer}
    SourceDef:
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      description: |
        Определение источника реестра: форма ответов `GET /sources`
        и `GET /sources/{code}`. Поля ввода `POST /sources` те же,
        кроме `type_name` — оно вычисляется по локали. Библиографические
        тексты не локализуются. Локализуется только `type_name` (бандл
        `sourcetype.<код>`).
      properties:
        code:
          type: string
          description: Строчная латиница/цифры/подчёркивание (ключ реестра).
        title: {type: string}
        type: {type: string, description: Код словаря source_types каталога.}
        type_name: {type: string, description: Название типа по локали запроса. Не входит в тело POST /sources.}
        authors:
          type: array
          items: {type: string}
        editors:
          type: array
          items: {type: string}
        year: {type: integer, description: Год издания 1900–2100.}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string, description: Канонизируется (пробелы/дефисы убираются).}
        urls:
          type: array
          items: {type: string}
          description: Оригинал, зеркала, архивные копии. Порядок
            значим.
    SourcesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SourceDef"}
        total: {type: integer, description: Общее число источников под фильтром q.}
        limit: {type: integer}
        offset: {type: integer}
    SourcesApplyResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: boolean
          description: Реестр фактически изменён. Значение `false` —
            идемпотентный повтор без изменений. `data_revision`
            при этом не двигается.
    Suggestion:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
    SuggestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Suggestion"}
    ParseCandidate:
      type: object
      required: [kind, system]
      description: Строгая система, принявшая обозначение.
      properties:
        kind: {type: string}
        system: {type: string}
    ParseResponse:
      type: object
      required: [kind, system, designation, fields, candidates]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string, description: Каноническое обозначение.}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        candidates:
          type: array
          description: |
            Все успешные строгие разборы в фиксированном порядке
            автодетекта, без дублей пары класс/система. При автодетекте
            первый элемент совпадает с основным результатом. Числового
            «конфиденса» у строгих грамматик нет: перечень кандидатов
            и есть эквивалент. Список пуст для обозначений вне строгих
            грамматик (явная система `other`).
          items: {$ref: "#/components/schemas/ParseCandidate"}
    Stats:
      type: object
      required: [schema_version, catalog_revision, data_revision, total, kinds]
      properties:
        schema_version: {type: integer}
        catalog_revision: {type: integer, format: int64}
        data_revision: {type: integer, format: int64}
        total: {type: integer}
        kinds:
          type: object
          additionalProperties: {type: integer}
          description: Количество записей по кодам классов.
    ParameterStats:
      type: object
      description: Фасетные агрегаты значений параметров класса.
      required: [kind, data_revision, parameters]
      properties:
        kind: {type: string}
        data_revision: {type: integer, format: int64, description: "Ревизия данных, согласованная с агрегатами."}
        parameters:
          type: array
          description: Параметры класса с данными, в алфавите кодов.
            Численные дают `min`/`max`, текстовые и enum — частоты
            значений.
          items: {$ref: "#/components/schemas/ParameterStat"}
    ParameterStat:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string, description: Отображаемое имя по локали запроса.}
        unit: {type: string, description: Код канонической единицы.}
        min: {type: number, description: Нижняя граница значений параметра в классе. Опускается при отсутствии.}
        max: {type: number, description: Верхняя граница значений параметра в классе. Опускается при отсутствии.}
        values:
          type: array
          description: |
            Частоты текстовых и enum значений — численные параметры
            их не дают. Порядок: по убыванию частоты, затем по тексту.
          items: {$ref: "#/components/schemas/ParameterValueFreq"}
    ParameterValueFreq:
      type: object
      required: [text, count]
      properties:
        text: {type: string}
        count: {type: integer, description: Число записей класса со значением.}
    ChangeEvent:
      type: object
      description: Событие применённой операции над записью устройства.
      required: [id, revision, op, kind, designation, device_id]
      properties:
        id: {type: integer, format: int64, description: Монотонный id события. Служит курсором потребителя.}
        revision: {type: integer, format: int64, description: data_revision транзакции события (после инкремента).}
        op: {type: string, enum: [created, updated, deleted]}
        kind: {type: string, description: Код класса записи.}
        designation: {type: string, description: Каноническое обозначение.}
        device_id: {type: integer, format: int64, description: Стабильный id записи.}
    ChangesResponse:
      type: object
      required: [events, data_revision]
      properties:
        events:
          type: array
          description: События в порядке возрастания id. Список может
            быть пустым.
          items: {$ref: "#/components/schemas/ChangeEvent"}
        data_revision: {type: integer, format: int64, description: "Текущая ревизия данных, согласованная со страницей."}
    ImportIssue:
      type: object
      description: Проблема прогона импорта. Позиция указывается,
        когда определена.
      required: [code, message]
      properties:
        record: {type: string, description: Обозначение записи. Опускается для проблем корневого уровня.}
        line: {type: integer, description: "Номер строки NDJSON. Опускается, когда не определён."}
        no: {type: integer, description: "Порядковый номер записи в секции документа. Опускается, когда не задан."}
        code: {type: string, description: Машиночитаемый код проблемы.}
        message: {type: string, description: Текст сообщения по локали запроса.}
    ImportReport:
      type: object
      description: Синхронный отчёт прогона импорта POST /api/v1/import.
      required: [dry_run, records, added, updated, skipped, rejected, catalog_applied, sources_applied, issues]
      properties:
        dry_run: {type: boolean, description: Контрольный прогон без записи в БД.}
        records: {type: integer, description: Записей в теле (включая отвергнутые).}
        added: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: "Слитое состояние совпадает с текущим: записи в БД нет, ревизии не инкрементируются."}
        rejected: {type: integer, description: "Записи, не применённые из-за проблем."}
        catalog_applied: {type: boolean, description: "Секция catalog применена с фактическим изменением. Повторный импорт идентичного каталога даёт false: catalog_revision не инкрементируется."}
        sources_applied: {type: boolean, description: "Реестр источников изменён корневой секцией sources: data_revision инкрементируется без событий change_events. Повторный импорт без изменений даёт false."}
        issues:
          type: array
          description: Полный список проблем прогона (может быть
            пустым).
          items: {$ref: "#/components/schemas/ImportIssue"}
    DeviceRecord:
      description: |
        Запись наполнения: строка-обозначение либо объект
        «name/system + секции». Секции групп — единые списки объектов
        {parameter, значение, условия}. Условия задаются соседними
        ключами по кодам.

        Семантика секций общая:

        - секция не задана или равна `null` — данные не меняются;
        - заданная секция заменяется целиком;
        - пустая секция (`[]` либо `{}`) очищает данные.
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name: {type: string, description: Обозначение.}
            system: {type: string, description: "Система обозначений. Обязательна для `other`."}
            fields:
              type: object
              description: |
                Явные классификационные поля задаются объектом «код
                поля → значение словаря». Поле `assembly` принимает
                число 0 или 1. Секция задаёт только поля, которые парсер системы обозначений
                записи не устанавливает сам, и только применимые
                к классу. Заменяется целиком.
              additionalProperties: {oneOf: [{type: string}, {type: number}]}
            attributes:
              type: object
              description: "Код атрибута → значение: строка, массив строк
                для атрибутов типа text_list, число или логическое.
                Значение null — атрибут не задаётся."
            manufacturers:
              type: array
              items: {type: string}
            variants:
              type: array
              items: {$ref: "#/components/schemas/DeviceVariant"}
            analogs:
              type: array
              description: |
                Исходящие направленные ссылки на аналоги: обозначения
                того же класса либо объекты с заметкой характера
                замены. Секция заменяется целиком. Меняются только
                исходящие ссылки записи: встречные ссылки других
                записей не затрагиваются. Обозначение канонизируется
                и обязано существовать в том же классе, иначе запрос
                завершается ошибкой `422` `unknown_analog`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
            synonyms:
              type: array
              description: |
                Исторические названия записи. Обозначение-синоним не
                является записью: find и поиск (`q=`) разрешают его
                в запись-владельца. Синонимы уникальны в пределах
                класса. Создание записи с обозначением, занятым
                синонимом другой записи, даёт конфликт (`409`). Годы —
                целые 1949–2100, `yearFrom` раньше `yearTo`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
                      yearFrom: {type: integer}
                      yearTo: {type: integer}
            sources:
              type: array
              description: |
                Ссылки на источники данных записи: строки-коды реестра
                либо объекты с кодом и заметкой места в источнике.
                Секция заменяется целиком. Код обязан существовать
                в реестре (определения задаёт корневая секция `sources`
                файла импорта), иначе запрос завершается ошибкой
                `422` `unknown_source`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [code]
                    properties:
                      code: {type: string}
                      note: {type: string}
    DeviceVariant:
      type: object
      properties:
        label: {type: string}
        attributes:
          type: object
          description: "Код атрибута → значение исполнения: конструктивные
            признаки, различающиеся по исполнениям. Форма значения —
            строка, массив строк для атрибутов типа text_list, число
            или логическое, как у attributes записи. Значение null —
            атрибут не задаётся. Значения заменяются вместе с набором
            variants."
    UnitDef:
      type: object
      required: [code, name, symbol]
      properties:
        code: {type: string}
        name: {type: string}
        symbol: {type: string}
    ConditionDef:
      type: object
      required: [code, name, allow_negative]
      properties:
        code: {type: string}
        name: {type: string}
        unit: {type: string}
        allow_negative: {type: boolean}
    GroupDef:
      type: object
      required: [code, section, name, sort_order]
      properties:
        code: {type: string}
        section: {type: string}
        name: {type: string}
        sort_order: {type: integer}
    ConditionSetItem:
      type: object
      required: [condition, mode]
      properties:
        condition: {type: string}
        mode: {type: string, enum: [required, optional]}
        fixed_value: {type: number}
    ConditionSet:
      type: object
      required: [no, items]
      properties:
        no: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/ConditionSetItem"}
    ParameterDef:
      type: object
      required: [code, group, name, value_type, allow_negative, sort_order, is_active, kinds, enum_values, condition_sets]
      properties:
        code: {type: string}
        group: {type: string}
        name: {type: string}
        unit: {type: string}
        value_type: {type: string, enum: [exact, at_least, at_most, range, limits, text, enum]}
        ceiling: {type: number}
        allow_negative: {type: boolean}
        validation_rule: {type: string}
        priority:
          type: string
          enum: [primary, secondary, tertiary]
          description: Градация значимости параметра. Отсутствует —
            не задана. Ранжируется как `secondary`. У существующей
            строки при импорте сохраняется действующая градация.
        sort_order: {type: integer, description: Порядок внутри градации значимости.}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
          description: Пустой список — применим ко всем классам.
        enum_values:
          type: array
          items: {type: string}
        condition_sets:
          type: array
          items: {$ref: "#/components/schemas/ConditionSet"}
    AttributeDef:
      type: object
      required: [code, name, type, sort_order, is_active, kinds, enum_values]
      properties:
        code: {type: string}
        name: {type: string}
        group: {type: string}
        type: {type: string, enum: [text, text_list, bool, int, number, enum]}
        unit: {type: string}
        validation_rule: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
        enum_values:
          type: array
          items: {type: string}
    SystemDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
    SystemKindRef:
      type: object
      required: [system, kind]
      properties:
        system: {type: string}
        kind: {type: string}
    RuleDef:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    KindRuleRef:
      type: object
      required: [kind, rule]
      properties:
        kind: {type: string}
        rule: {type: string}
    CatalogSnapshot:
      type: object
      required: [revision, kinds, systems, system_kinds, units, conditions, groups, parameters, attributes, rules, kind_rules, dictionaries]
      properties:
        revision: {type: integer, format: int64, description: catalog_revision.}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
        systems:
          type: array
          items: {$ref: "#/components/schemas/SystemDef"}
        system_kinds:
          type: array
          items: {$ref: "#/components/schemas/SystemKindRef"}
        units:
          type: array
          items: {$ref: "#/components/schemas/UnitDef"}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/ConditionDef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupDef"}
        parameters:
          type: array
          items: {$ref: "#/components/schemas/ParameterDef"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/AttributeDef"}
        rules:
          type: array
          items: {$ref: "#/components/schemas/RuleDef"}
        kind_rules:
          type: array
          items: {$ref: "#/components/schemas/KindRuleRef"}
        dictionaries:
          $ref: "#/components/schemas/FieldDictionaries"
