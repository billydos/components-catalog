    update: Импорт файла наполнения (NDJSON, jsonc, yaml)
  - target: $.paths['/api/v1/import'].post.description
    update: |
      Тело — файл наполнения; формат задаётся обязательным заголовком
      Content-Type: application/x-ndjson — поток NDJSON (одна JSON-строка —
      одна сущность: строки-обёртки `{"<класс>": <запись>}`, блок catalog —
      строками-подразделами до записей; план 04 §4) читается потоково,
      без загрузки тела целиком и без потолка размера запроса — память
      ограничена потолком одной строки (16 МиБ); application/json (jsonc,
      комментарии допустимы) и application/yaml — документ читается
      целиком с потолком тела 16 МиБ (превышение — 400
      invalid_import_file; для больших объёмов — NDJSON). Отсутствующий
      и неподдерживаемый Content-Type — 400 validation_failed;
      параметры Content-Type (charset) допускаются и игнорируются.
      Ответ — синхронный отчёт после EOF: счётчики исходов и полный
      список проблем прогона (Issues-модель: корректные записи
      применяются, ошибочные — нет, запись не применяется вовсе);
      200 возвращается и для прогонов с проблемами. Жёсткая ошибка —
      только синтаксис формата и чтение потока (400 invalid_import_file).
      Единственный параметр запроса — dry_run=true: контрольный прогон
      того же конвейера проверок без записи в БД (отчёт помечается
      dry_run); значение строго true либо false (иное и повтор параметра —
      400 validation_failed), прочие ключи — 400. Прогресс по REST
      не отдаётся — запрос синхронный (наблюдение прогона — хук метрик
      сайта); запись монтируется сайтом только в защищённые маршруты.
