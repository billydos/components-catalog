# Русская локализация канонической (en) спецификации api/openapi.yaml.
# Формат — OpenAPI Overlay Specification 1.1 (spec.openapis.org/overlay):
# target — JSONPath к узлу канонического документа, update — русский текст.
# Каждый узел прозы (summary/description) канонического файла обязан иметь
# действие здесь (полноту проверяет api/openapi_test.go); тексты вне прозы
# (примеры-данные, коды) не локализуются.
#
# Регенерация api/dist/openapi.ru.yaml — команда в api/redocly.yaml
# (единственное место с ней). Несовпадение таргета узлу Redocly
# игнорирует молча — рассинхрон ловит api/openapi_test.go.
overlay: 1.1.0
info:
  title: Русская локализация components-catalog REST API
  version: 0.1.0
actions:
  - target: $.info.description
    update: |
      Встраиваемый справочник электронных компонентов: REST /api/v1 — тонкий
      транспорт над сервисным слоем Go-библиотеки. Аутентификация,
      авторизация и лимитирование — на стороне сайта, монтирующего хендлер
      (защищённые маршруты — на усмотрение сайта). Транспорт: JSON, UTF-8.

      Ошибки — модель `{"code", "message"}`: `code` —
      машиночитаемый латиницей snake_case, `message` — текст сообщения
      из каталога модуля по локали запроса (en — канонический, ru — бандл;
      Accept-Language). Статусы: 400 (неверный запрос),
      404 (не найдено), 405 (метод не поддерживается путём; заголовок Allow
      перечисляет допустимые), 409 (конфликт), 422 (семантика записи),
      500 (внутренняя ошибка). Неизвестный путь — 404 api_route_not_found
      той же модели ошибок.

      Локализация (D9): база модуля языконезависима — кодовые поля ответов
      (kind, system, unit, parameter, attribute, section) всегда канонические.
      Отображаемые поля (`name`, `kind_name`, `system_name`, описания, имена
      и символы единиц в /catalog) заполняются по локали запроса из бандлов
      модуля; локаль — заголовок Accept-Language (q-значения, базовый подтег),
      по умолчанию и при неподдерживаемом языке — en (поддерживаются en, ru).

      Семантика секций тела записи (attributes, секции групп, manufacturers,
      variants, analogs, synonyms, sources): отсутствует/null — не менять
      (для POST — не задано), задана — заменить целиком, `[]`/`{}` — очистить,
      ошибка в любом значении — запись не применяется вовсе. Ссылки sources
      адресуют коды глобального реестра источников файла наполнения
      (план 03 §13); определения реестра задаёт корневая секция sources
      импорта, не тело записи.
  - target: $.tags[?@['name']=='catalog'].description
    update: Справочники модуля (классы, каталог).
  - target: $.tags[?@['name']=='components'].description
    update: "Записи приборов: поиск, карточка, запись, удаление."
  - target: $.tags[?@['name']=='service'].description
    update: Служебные данные (статистика, автодополнение).
  - target: $.tags[?@['name']=='import'].description
    update: "Импорт файлов наполнения: поток NDJSON."
  - target: $.paths['/api/v1/kinds'].get.summary
    update: Классы приборов
  - target: $.paths['/api/v1/kinds'].get.responses['200'].description
    update: Классы приборов (name — по локали запроса).
  - target: $.paths['/api/v1/catalog'].get.summary
    update: Снимок каталога
  - target: $.paths['/api/v1/catalog'].get.description
    update: |
      Параметры, атрибуты, условия, единицы, группы, системы обозначений,
      семейства и словари значений словарных полей обозначения
      (material, subclass, adjustment, category) —
      для построения форм и фильтров. Ключи полей повторяют
      формат наполнения (snake_case по колонкам каталожных таблиц);
      отображаемые строки (name, описания, имена и символы единиц) —
      по локали запроса (D9).
      ETag — по catalog_revision и локали представления (разные локали —
      разные ETag, RFC 9110): снимок кэшируется до смены каталога.
  - target: $.paths['/api/v1/catalog'].get.responses['200'].description
    update: Снимок каталога.
  - target: $.paths['/api/v1/catalog'].get.responses['200'].headers.ETag.description
    update: 'Сильный ETag вида "catalog-<catalog_revision>-<локаль>".'
  - target: $.paths['/api/v1/catalog'].get.responses['304'].description
    update: Снимок не менялся (If-None-Match).
  - target: $.paths['/api/v1/stats'].get.summary
    update: Количество записей, версия схемы, ревизии; при kind — агрегаты параметров класса
  - target: $.paths['/api/v1/stats'].get.description
    update: |
      Без kind — агрегаты модуля: количества записей по классам, версия
      схемы, ревизии. С kind — фасетные агрегаты значений параметров
      класса: min/max численных параметров для
      слайдеров параметрических фильтров (границы — по семантике
      фильтров поиска: value_min/value_max и value_exact; at_least
      задаёт только min, at_most — только max, limits — min и/или
      max по заданным границам) и частоты текстовых/
      enum значений — число записей класса со значением (значение
      в данных типа и нескольких исполнениях одной записи считается
      один раз). В агрегаты входят данные типа в целом и исполнений —
      как у фильтров поиска; параметры без данных в классе и
      неприменимые к классу (D7; в том числе с данными, оставшимися
      после изменения применимости каталогом) в ответ не входят,
      порядок параметров — алфавит кодов (как /catalog),
      значения — по убыванию частоты, затем по тексту. Повтор
      разбираемого параметра и посторонний ключ запроса — 400
      validation_failed; неизвестный класс — 400 validation_failed.
  - target: $.paths['/api/v1/stats'].get.parameters[?@['name']=='kind'].description
    update: "Код класса: ответ — фасетные агрегаты значений параметров этого класса (без параметра и с пустым значением — агрегаты модуля)."
  - target: $.paths['/api/v1/stats'].get.responses['200'].description
    update: Агрегаты модуля (без kind) либо фасетные агрегаты
      класса (с kind); name — по локали запроса, unit — канонический код.
  - target: $.paths['/api/v1/stats'].get.responses['200'].headers.Vary.description
    update: Accept-Language — на ответе с kind (представление
      локализуется); на агрегатах модуля без kind не отдаётся.
  - target: $.paths['/api/v1/changes'].get.summary
    update: Поток событий изменений записей (change feed)
  - target: $.paths['/api/v1/changes'].get.description
    update: |
      Инкрементальная синхронизация производных индексов сайта: события
      применённых операций над записями (created/updated/deleted, класс,
      обозначение, стабильный id записи) в порядке возрастания id
      события. События записываются той же транзакцией, что меняет
      данные: событие и изменение атомарны, исход Skipped событий
      не оставляет (включая компенсационные удаления импортёра —
      штатный deleted).

      Курсор — параметр after: id последнего полученного события
      (after=0 — с начала фида); ревизия курсором быть не может: её
      связь с событиями — деталь пути записи (возможны несколько
      событий в одной транзакции либо инкремент мимо фида), id
      присваивается вставкой и остаётся плотным монотонным курсором.
      Ответ содержит текущую data_revision (согласована со страницей
      событий). Фид покрывает только изменения данных (data_revision);
      изменения каталога (catalog_revision) в фид не входят — для них
      ETag GET /catalog. Актёров и состояний before/after нет — это
      не аудит (история изменений — зона сайта). Автоматической
      ретенции нет: рост ограничен редакционным масштабом, очистка —
      вручную (SQL), REST-пути очистки нет. Повтор разбираемого
      параметра и посторонний ключ запроса — 400 validation_failed.
  - target: $.paths['/api/v1/changes'].get.parameters[?@['name']=='after'].description
    update: "Курсор: id последнего полученного события (0 — с начала фида)."
  - target: $.paths['/api/v1/changes'].get.parameters[?@['name']=='limit'].description
    update: "Число событий страницы (≤ 1000)."
  - target: $.paths['/api/v1/changes'].get.responses['200'].description
    update: Страница событий и текущая data_revision.
  - target: $.paths['/api/v1/components'].get.summary
    update: Поиск записей
  - target: $.paths['/api/v1/components'].get.description
    update: |
      Подстрока обозначения, система, фильтр по набору стабильных id,
      фильтры полей/атрибутов/параметров, сортировка, пагинация. Ответ —
      список с обозначением, классом, системой и ключевыми полями;
      ETag — по data_revision, канонической строке запроса и локали
      представления (разные фильтры/сортировки или локали — разные
      ETag, RFC 9110). Повтор любого параметра
      запроса — 400 validation_failed; исключения — намеренно
      повторяемые id (набор фильтра, до 200 значений), словарные
      фильтры material/subclass/adjustment/category (мультивыбор —
      семантика ИЛИ внутри поля) и values (колонки значений строк выдачи).

      Помимо перечисленных параметров допустимы:

      * фильтры полей обозначения — код поля как имя параметра:
        текстовые `material`, `subclass`, `letters`, `construction`,
        `prefix`, `family`, `series`, `adjustment`, `category`, `base`
        (тип — базовое обозначение записи, значение канонизируется как
        обозначение); числовые `junctions`, `group`, `dev_number`,
        `assembly`, `feature`, `modification`, `chip` (равенство);
        значения словарных полей `material` (`si`, `ge`, `ga`, `in`,
        `sic`, `other`, `gaas`), `subclass` (`bjt`, `zener`, …),
        `adjustment` (`fixed`, `variable`, `preset`) и `category` (коды
        словаря каталога — секция `dictionaries` GET /catalog) —
        стабильный код словаря либо отображаемое название локали
        (канонизируется; D9); словарные поля повторяемы: каждое значение
        канонизируется отдельно, набор — семантика ИЛИ, дубликат
        канонического кода — 400 validation_failed; прочие текстовые
        поля — нормативные элементы обозначения (для записей `other`
        поле `series` задаётся секцией `fields`);
      * `attr.<код>=<значение>` — фильтр по атрибуту (текст либо число
        по типу атрибута; логические атрибуты не фильтруются; текстовый
        фильтр атрибута text_list — равенство любому элементу списка);
      * `par.<код>.min=`, `par.<код>.max=`, `par.<код>.exact=` — границы
        численного параметра; `par.<код>.text=` либо `par.<код>=<текст>` —
        текст/enum.

      Вариантные параметрические фильтры применяются в пределах одного
      исполнения. Фильтр по параметру/атрибуту, неприменимому к классу
      запроса, — 400 parameter_not_applicable/attribute_not_applicable.
      Неизвестный параметр запроса — 400 validation_failed.
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='kind'].description
    update: "Класс приборов (transistor, diode, resistor, capacitor, relay)."
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='system'].description
    update: "Система обозначений (gost, ost, pro, jedec, jis, other)."
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='q'].description
    update: "Подстрока обозначения либо исторического названия записи — синонима (регистр не важен)."
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='id'].description
    update: |
      Фильтр по набору стабильных id записей — намеренно повторяемый
      параметр (одно из исключений строгости запроса — второе,
      словарные фильтры мультивыбора, описано выше): до 200 значений,
      каждое — целое положительное, дубликат значения — 400
      validation_failed. Семантика — пересечение с прочими фильтрами;
      id без записи либо отсечённые прочими фильтрами — отсутствие
      строки в выдаче (отдельной ошибки нет). Без sort порядок
      выдачи — порядок передачи id (с sort — заданная сортировка).
      Сценарий: составной поиск «внешний отбор сайта × параметрика
      модуля» без дублирования каталога.
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='values'].description
    update: |
      Колонки значений строк выдачи — намеренно повторяемый
      параметр: код параметра каталога либо attr.<код атрибута>,
      до 16 кодов, дубликат — 400 validation_failed. Значение —
      элемент формы CardValue по каждому коду, присутствующему
      у записи (нет значения — нет элемента), в порядке запроса:
      name — локаль запроса, unit — канонический код единицы,
      conditions — только у параметров. Правило выбора значения
      при нескольких строках у записи (данные типа + исполнения):
      численные — агрегат границ MIN/MAX (одиночная строка
      сохраняет форму exact/at_least/at_most/limits), текстовые/enum —
      данные типа поверх исполнений. Логические атрибуты —
      400 validation_failed; неизвестный код — 400
      unknown_parameter/unknown_attribute, неприменимый к классу
      запроса — 400 parameter_not_applicable/
      attribute_not_applicable (как у фильтров).
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='sort'].description
    update: |
      Ключи сортировки через запятую, «-» — убывание: designation,
      id, код поля разбора либо код числового параметра каталога,
      применимого к классу запроса. Параметры text/enum и
      неприменимые к классу — 400 (validation_failed/
      parameter_not_applicable). Значение записи по параметру —
      по направлению: возрастание — нижняя граница (value_min,
      точное либо единственная верхняя), убывание — верхняя
      (value_max, точное либо единственная нижняя); учитываются
      значения типа и исполнений (как в фильтрах), записи без
      значения — в конце независимо от направления. К любому
      порядку добавляется финальный (kind, designation).
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='limit'].description
    update: "Размер страницы (≤ 200)."
  - target: $.paths['/api/v1/components'].get.parameters[?@['name']=='offset'].description
    update: Смещение страницы.
  - target: $.paths['/api/v1/components'].get.responses['200'].description
    update: Страница результатов.
  - target: $.paths['/api/v1/components'].get.responses['200'].headers.ETag.description
    update: |
      Сильный ETag вида "data-<data_revision>-<hash>-<локаль>":
      hash — хэш канонической строки запроса (имена параметров
      отсортированы, пары name=value через «&»; повторяемый id
      входит каждым значением — порядок значим).
  - target: $.paths['/api/v1/components'].get.responses['304'].description
    update: Данные не менялись (If-None-Match).
  - target: $.paths['/api/v1/components'].post.summary
    update: Создание записи
  - target: $.paths['/api/v1/components'].post.description
    update: |
      Тело — запись наполнения: строка-обозначение либо объект
      «name/system + секции». Класс определяется автодетектом по
      обозначению; для системы other создание адресуется PUT с классом
      в пути. Существующий (kind, designation) — 409 already_exists
      без изменения записи (создание атомарно, гонка параллельных
      POST не применяет секции к чужой записи).
  - target: $.paths['/api/v1/components'].post.responses['201'].description
    update: Запись создана.
  - target: $.paths['/api/v1/components'].post.responses['404'].description
    update: Редкая гонка — запись удалена между применением
      и чтением карточки для ответа.
  - target: $.paths['/api/v1/components/id/{id}'].get.summary
    update: Карточка по стабильному id
  - target: $.paths['/api/v1/components/id/{id}'].get.description
    update: Обозначения, содержащие «/» (MIL-имена), адресуются
      этим путём или поиском — прямой путь для них не гарантируется.
  - target: $.paths['/api/v1/components/id/{id}'].get.responses['200'].description
    update: Карточка записи.
  - target: $.paths['/api/v1/components/{kind}/{designation}'].get.summary
    update: Карточка записи
  - target: $.paths['/api/v1/components/{kind}/{designation}'].get.description
    update: |
      Обозначение + система + поля разбора, атрибуты, значения параметров
      по группам с условиями, исполнения-варианты (матрица «номинал ×
      напряжение → габариты/масса»), аналоги (исходящие и встречные),
      производители. Обозначение в пути URL-кодируется.
  - target: $.paths['/api/v1/components/{kind}/{designation}'].get.responses['200'].description
    update: Карточка записи.
  - target: $.paths['/api/v1/components/{kind}/{designation}'].put.summary
    update: Upsert записи с семантикой секций
  - target: $.paths['/api/v1/components/{kind}/{designation}'].put.description
    update: |
      Тело — запись наполнения (name/system + секции); name обязан
      совпадать с designation пути (иначе 422 designation_mismatch).
      Класс задаётся путём (переопределяет автодетект — способ создания
      записей системы other). Исходы: Added (создана),
      UpdatedExisting (обновлена), Skipped (слитое состояние совпадает —
      записи в БД и инкремента ревизий нет).
  - target: $.paths['/api/v1/components/{kind}/{designation}'].put.responses['200'].description
    update: Запись применена.
  - target: $.paths['/api/v1/components/{kind}/{designation}'].put.responses['404'].description
    update: Редкая гонка — запись удалена между применением
      и чтением карточки для ответа.
  - target: $.paths['/api/v1/components/{kind}/{designation}'].delete.summary
    update: Удаление записи (каскад)
  - target: $.paths['/api/v1/components/{kind}/{designation}'].delete.responses['204'].description
    update: Запись удалена.
  - target: $.paths['/api/v1/suggest'].get.summary
    update: Автодополнение по префиксу обозначения
  - target: $.paths['/api/v1/suggest'].get.description
    update: Отключаем конфигурацией модуля — хендлер не монтируется
      (404 при отключении). Повтор разбираемого параметра и посторонний
      ключ запроса — 400 validation_failed (опечатки не молчат).
  - target: $.paths['/api/v1/suggest'].get.parameters[?@['name']=='q'].description
    update: "Префикс обозначения либо исторического названия записи — синонима."
  - target: $.paths['/api/v1/suggest'].get.parameters[?@['name']=='kind'].description
    update: Класс приборов.
  - target: $.paths['/api/v1/suggest'].get.responses['200'].description
    update: Подсказки.
  - target: $.paths['/api/v1/parse'].get.summary
    update: Разбор обозначения
  - target: $.paths['/api/v1/parse'].get.description
    update: |
      Разбор обозначения теми же строгими грамматиками, что и CLI parse:
      без system — автодетект (фиксированный порядок: полупроводник
      gost → pro → jedec → jis → резистор gost/ost → конденсатор gost);
      с system — разбор в явной системе (для other класс kind обязателен,
      иначе 400 kind_ambiguous). Обозначение канонизируется (регистр,
      пробелы, типографские дефисы не важны); system/kind переопределяют
      автодетект, противоречие — 400 designation_mismatch. Ответ — класс,
      система, каноническое обозначение, поля разбора и кандидаты: все
      успешные строгие разборы в порядке автодетекта без дублей пары
      класс/система (первый кандидат при автодетекте совпадает
      с основным результатом). Числового «конфиденса» у строгих
      грамматик нет — перечень кандидатов и есть эквивалент. Повтор
      любого разбираемого параметра запроса и посторонний ключ запроса —
      400 validation_failed (опечатки не молчат).
