openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: components-catalog REST API
  version: 0.1.0
  description: |
    An embeddable reference of electronic components. REST `/api/v1`
    works as a thin transport over the service layer of the Go
    library. Authentication, authorization, and rate limiting stay
    with the site that mounts the handler. Protected routes are the
    site's own choice. Transport: JSON, UTF-8.

    Errors use the `{"code", "message"}` model. The `code` field
    contains a machine-readable Latin snake_case string. The
    `message` field carries the text from the module's message
    catalog in the request language: English is the catalog's
    canonical language and Russian is a bundle. The language is
    chosen by the `Accept-Language` header.

    Response statuses:

    - `400`: bad request;
    - `404`: not found; an unknown route yields `404` with the code
      `api_route_not_found` in the same error model;
    - `405`: the method is not supported by the route, and the
      `Allow` header lists the allowed methods;
    - `409`: conflict;
    - `422`: record semantics error;
    - `500`: internal error.

    Localization. The module's database is language-neutral: the code
    fields of responses (`kind`, `system`, `unit`, `parameter`,
    `attribute`, `section`) are always canonical. Display fields
    (`name`, `kind_name`, `system_name`, descriptions, unit names and
    symbols in `/catalog`) are filled from the module's bundles in
    the request language. The language is determined by the
    `Accept-Language` header (q-values, base subtag). Supported
    languages are `en` and `ru`. The default, and the fallback for
    unsupported languages, is `en`.

    Sections of the record body (`attributes`, group sections,
    `manufacturers`, `variants`, `analogs`, `synonyms`, `sources`)
    follow uniform rules:

    - a section that is absent or `null` leaves the data unchanged;
      for record creation it means “unset”;
    - a present section replaces its content wholesale;
    - an empty section (`[]` or `{}`) clears the data;
    - an error in at least one value cancels the whole record: no
      partial application exists.

    The `sources` section references codes of the global source
    registry. The registry holds bibliographic definitions shared by
    all records. They are introduced by the import file's root
    `sources` section and by `POST /api/v1/sources`, not by the
    record body.
servers: []
tags:
  - name: catalog
    description: Module reference data (kinds, catalog).
  - name: components
    description: "Device records: search, card, create, update, delete."
  - name: sources
    description: "Record data source registry: read, apply, delete."
  - name: service
    description: Auxiliary data (stats, autocomplete).
  - name: import
    description: "Fill file import: NDJSON stream."
paths:
  /api/v1/kinds:
    get:
      tags: [catalog]
      operationId: kinds
      summary: Device kinds
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Device kinds. The `name` field is filled per the
            request locale.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KindsResponse"}
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/catalog:
    get:
      tags: [catalog]
      operationId: catalog
      summary: Catalog snapshot
      description: |
        Parameters, attributes, conditions, units, groups, designation
        systems, and families — everything needed to build forms and
        filters. The snapshot also returns the value dictionaries of
        the designation dictionary fields: `material`, `subclass`,
        `adjustment`, and `category`.

        Field keys mirror the fill format: `snake_case` after catalog
        table columns. Display strings (`name`, descriptions, unit
        names and symbols) are filled per the request locale.

        The `ETag` is derived from `catalog_revision` and the
        representation locale: different locales yield different
        `ETag`s (RFC 9110). The snapshot is cached until the catalog
        changes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Catalog snapshot.
          headers:
            ETag:
              description: Strong `ETag` of the form "catalog-<catalog_revision>-<locale>".
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogSnapshot"}
        "304":
          description: The snapshot has not changed (checked by `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/stats:
    get:
      tags: [service]
      operationId: stats
      summary: Module stats or kind parameter aggregates
      description: |
        Without the `kind` parameter the response contains module
        aggregates: record counts by kind, the schema version, and
        the revisions.

        With the `kind` parameter the response contains facet
        aggregates of the kind's parameter values. Numeric parameters
        yield `min`/`max` — bounds for parametric filter sliders.
        Text and enum parameters yield value frequencies. A frequency
        is the number of records in the kind having the value: a
        value present in the type data and in several variants of one
        record counts once.

        The bounds follow the search filter semantics
        (`value_min`/`value_max` and `value_exact`): `at_least`
        contributes only `min`, `at_most` — only `max`, and `limits`
        — `min` and/or `max` as given.

        The aggregates include type-level data and variant data — as
        the search filters do. Parameters without data in the kind
        are excluded. So are parameters not applicable to the kind:
        applicability is catalog data, and the response may also omit
        parameters that still have data left after the catalog changed
        their applicability.

        The parameter order is alphabetical by code, as in `/catalog`.
        The values are ordered by descending frequency, then by text.

        The facet representation is cacheable. The `ETag` is derived
        from `catalog_revision` (parameter applicability),
        `data_revision`, the kind, and the locale. `If-None-Match`
        short-circuits with `304` before the aggregate read.

        A repeated recognized parameter, an unknown query key, and an
        unknown kind fail with `400` `validation_failed`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: kind, in: query, schema: {type: string}, description: "Kind code. With the parameter the response contains facet aggregates of this kind's parameter values. Without the parameter, or with an empty value, module aggregates are returned."}
      responses:
        "200":
          description: |
            Module aggregates or the kind's facet aggregates.

            Without `kind` the response carries no `ETag`: the count
            is cheap, and the revisions are returned in the response
            itself. With `kind` the response carries an `ETag`. The
            `name` field is filled per the request locale, and `unit`
            contains the canonical code.
          headers:
            Vary:
              description: |
                Set only on the response with `kind`: the
                representation is localized. Not sent on module
                aggregates without `kind`.
              schema: {type: string, const: Accept-Language}
            ETag:
              description: |
                Strong `ETag` of the form
                "stats-<catalog_revision>-<data_revision>-<kind>-<locale>";
                set only on the facet response with `kind`.
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Stats"
                  - $ref: "#/components/schemas/ParameterStats"
        "304":
          description: |
            The facet aggregates have not changed (checked by
            `If-None-Match`). The response is sent only with `kind`.
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/changes:
    get:
      tags: [service]
      operationId: changes
      summary: Record change event stream (change feed)
      description: |
        A stream of record change events for incremental
        synchronization of a site's derived indexes. Each event
        describes an applied operation on a record: `created`/
        `updated`/`deleted`, the kind, the designation, and the
        stable record id. Events are ordered by ascending event id.

        Events are written by the same transaction that changes the
        data, so the event and the change are atomic. A `Skipped`
        outcome leaves no event. Importer compensating deletions
        produce a regular `deleted` event.

        The cursor is the `after` parameter — the id of the last
        event received. `after=0` reads the stream from the start. A
        revision cannot serve as the cursor: its relation to events
        is a write-path detail (one transaction may produce several
        events, and an increment may pass without an event). The id
        is assigned on insert and remains a dense monotonic cursor.

        The response carries the current `data_revision`, consistent
        with the event page. The stream covers only data changes
        (`data_revision`). Catalog changes (`catalog_revision`) are
        not part of it: for those, use the `ETag` of `GET /catalog`.

        Events carry no actors and no before/after states: this is
        not an audit, and change history remains the site's domain.
        There is no automatic retention: growth is bounded by the
        scale of editorial activity, cleanup is performed manually
        with SQL, and there is no REST cleanup route.

        A repeated recognized parameter and an unknown query key fail
        with `400` `validation_failed`.
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}, description: "Cursor: the id of the last event received. 0 reads the stream from the start."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}, description: "Number of events in the page (≤ 1000)."}
      responses:
        "200":
          description: A page of events and the current `data_revision`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangesResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components:
    get:
      tags: [components]
      operationId: components_list
      summary: Search records
      description: |
        Record search: a designation substring, a system, a set of
        stable ids, field, attribute, and parameter filters, sorting,
        pagination. The response is a list of records with the
        designation, kind, system, and key fields.

        The `ETag` is derived from `data_revision`, the canonical
        query string, and the representation locale: different
        filters, sorts, or locales yield different `ETag`s
        (RFC 9110).

        Repeating any query parameter fails with `400`
        `validation_failed`. The exceptions are the intentionally
        repeatable parameters:

        - `id` — a filter set, up to 200 values;
        - the dictionary filters `material`/`subclass`/
          `adjustment`/`category` — multi-select with OR semantics
          within a field;
        - `values` — the value columns of result rows.

        Besides the parameters described above, the request accepts:

        - designation field filters: the field code serves as the
          parameter name. Textual fields: `material`, `subclass`,
          `letters`, `construction`, `prefix`, `family`, `series`,
          `adjustment`, `category`, `base`. Numeric fields with
          equality comparison: `junctions`, `group`, `dev_number`,
          `assembly`, `feature`, `modification`, `chip`. The `base`
          field holds the record's base designation, and its value is
          canonicalized as a designation;
        - the dictionary fields (`material`, `subclass`,
          `adjustment`, `category`) accept a stable dictionary code or
          a localized display name. The value is canonicalized.
          The dictionary fields are repeatable: each value is
          canonicalized separately, the set has OR semantics, and a
          duplicate canonical code fails with `400`
          `validation_failed`;
        - allowed dictionary codes:
          - `material`: `si`, `ge`, `ga`, `in`, `sic`, `other`, `gaas`;
          - `subclass`: `bjt`, `zener`, …;
          - `adjustment`: `fixed`, `variable`, `preset`;
          - `category`: catalog dictionary codes from the
            `dictionaries` section of the `GET /catalog` response;
        - the `base` field holds the record's base designation. Its
          value is canonicalized as a designation;
        - the other text fields are normative elements of the
          designation. For `other` records the `series` field is set
          by the `fields` section;
        - `attr.<code>=<value>` — an attribute filter: text or number
          per the attribute type. Boolean attributes cannot be
          filtered. A text filter on a `text_list` attribute compares
          against any element of the list;
        - numeric parameter bounds: `par.<code>.min=`,
          `par.<code>.max=`, `par.<code>.exact=`;
        - text or enum: `par.<code>.text=` or `par.<code>=<text>`.

        Variant parametric filters apply within a single variant. A
        filter on a parameter or attribute not applicable to the
        queried kind fails with `400`
        `parameter_not_applicable`/`attribute_not_applicable`. An
        unknown query parameter yields `400` `validation_failed`.
      parameters:
        - {name: kind, in: query, schema: {type: string}, description: "Device kind (transistor, diode, resistor, capacitor, relay)."}
        - {name: system, in: query, schema: {type: string}, description: "Designation system (gost, ost, pro, jedec, jis, other)."}
        - {name: q, in: query, schema: {type: string}, description: "Substring of a designation or of a record's historical name (a synonym). Case is ignored."}
        - name: id
          in: query
          description: |
            Filter by a set of stable record ids. The parameter is
            intentionally repeatable. Up to 200 values are allowed, each
            a positive integer. A duplicate value fails with `400`
            `validation_failed`.

            The filter intersects with the other filters. An id
            without a record, or an id cut off by the other filters,
            simply yields no row: there is no separate error. Without
            `sort` the output follows the id transmission order. With
            `sort` it follows the requested sorting.

            Use case: a composite search of “site-side preselection ×
            module parametrics” without duplicating the catalog.
          schema:
            type: array
            items: {type: integer, format: int64, minimum: 1}
            minItems: 1
            maxItems: 200
            uniqueItems: true
          style: form
          explode: true
        - name: values
          in: query
          description: |
            The value columns of result rows. The parameter is
            intentionally repeatable. A value is a catalog parameter code
            or `attr.<attribute code>`, up to 16 codes. A duplicate
            fails with `400` `validation_failed`.

            For every code present on the record, an element of the
            `CardValue` schema is returned (no value — no element),
            in request order. The `name` field is filled per the
            request locale, `unit` contains the canonical unit code,
            and `conditions` occur only on parameters.

            The value selection rule when a record has several rows
            (type data plus variants): numeric parameters yield a
            MIN/MAX bounds aggregate — a single row keeps its
            `exact`/`at_least`/`at_most`/`limits` shape. Text and
            enum parameters take the type data over the variants.

            Boolean attributes yield `400` `validation_failed`. An
            unknown code fails with `400`
            `unknown_parameter`/`unknown_attribute`. One not
            applicable to the queried kind yields `400`
            `parameter_not_applicable`/`attribute_not_applicable`, as
            with filters.
          schema:
            type: array
            items: {type: string, minLength: 1}
            minItems: 1
            maxItems: 16
          style: form
          explode: true
        - name: sort
          in: query
          schema: {type: string}
          description: |
            Comma-separated sort keys. A `-` before a key requests
            descending order. Allowed keys: `designation`, `id`, a
            parsed-field code, or a numeric catalog parameter code
            applicable to the queried kind. `text`/`enum` parameters
            and ones not applicable to the kind yield `400`
            (`validation_failed`/`parameter_not_applicable`).

            A record's value for a parameter is chosen by the sort
            direction. Ascending takes the lower bound (`value_min`,
            the exact value, or the sole upper bound). Descending
            takes the upper bound (`value_max`, the exact value, or
            the sole lower bound). Type-level and variant values are
            both considered, as in filters. Records without a value
            go last regardless of direction. A final (`kind`,
            `designation`) ordering is appended to any order.
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Page size (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Page offset."}
      responses:
        "200":
          description: A page of results.
          headers:
            ETag:
              description: |
                Strong `ETag` of the form "data-<data_revision>-<hash>-<locale>".
                `hash` is a hash of the canonical query string:
                parameter names sorted, `name=value` pairs joined with
                “&”. The repeatable `id` contributes each of its
                values, and the order is significant.
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchPage"}
        "304":
          description: The data has not changed (checked by `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [components]
      operationId: components_create
      summary: Create a record
      description: |
        The request body is a fill record: a designation string or a
        “name/system + sections” object. The record's kind is
        determined by designation autodetect. For system `other`,
        creation is performed by `PUT` with the kind in the path.

        A (`kind`, `designation`) pair already present in the
        database yields `409` `already_exists` without modifying the
        record. Creation is atomic: a race of concurrent `POST`s
        does not apply sections to someone else's record.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            A rare race: the record was deleted between applying and
            reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/id/{id}:
    get:
      tags: [components]
      operationId: components_by_id
      summary: Card by stable id
      description: |
        Designations containing `/` (MIL names) are addressed by this
        route or by search: a direct route is not guaranteed for
        them.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/{kind}/{designation}:
    get:
      tags: [components]
      operationId: components_get
      summary: Record card
      description: |
        The record card shows the designation, the system, and the
        parsed fields. It also shows attributes, parameter values by
        groups with conditions, variants (a “nominal × voltage →
        dimensions/mass” matrix), analogs (outgoing and backlinks),
        and manufacturers. The designation in the path is
        URL-encoded.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [components]
      operationId: components_put
      summary: Record upsert with section semantics
      description: |
        The request body is a fill record: `name`/`system` and
        sections. The `name` field must match the path `designation`,
        otherwise the request fails with `422`
        `designation_mismatch`. The kind is set by the path and
        overrides autodetect — this is how records of system `other`
        are created.

        Outcomes:

        - `Added` — the record was created;
        - `UpdatedExisting` — the record was updated;
        - `Skipped` — the merged state matches the current one: no
          database write and no revision increment.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "200":
          description: Record applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            A rare race: the record was deleted between applying and
            reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [components]
      operationId: components_delete
      summary: Delete a record (cascade)
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Record deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources:
    get:
      tags: [sources]
      operationId: sources_list
      summary: Source registry page
      description: |
        The record data source registry — a global registry of
        bibliographic definitions shared by all records. The response
        is ordered by code. Pagination and substring search over code
        or title are available.

        The search is case-insensitive, with a dialect caveat:
        PostgreSQL folds case across all alphabets, SQLite only
        Latin, so Cyrillic titles on SQLite are matched with exact
        case. Persons (authors and editors) and links are read only
        for the page rows.

        The `ETag` is derived from `data_revision`, the canonical
        query string, and the representation locale, as in
        `GET /components`. Registry changes bump `data_revision`. A
        repeated recognized parameter and an unknown query key fail
        with `400` `validation_failed`. Reading the full registry
        remains an export concern (the Go API `ListSources`), not
        REST.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: q, in: query, schema: {type: string}, description: "Substring over the source code or title; without `q` the whole registry is returned, paginated."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Page size (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Page offset."}
      responses:
        "200":
          description: Registry page. The `type_name` field is filled
            per the request locale.
          headers:
            ETag:
              description: |
                Strong `ETag` of the form "data-<data_revision>-<hash>-<locale>":
                `hash` is a hash of the canonical query string, as in search.
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesPage"}
        "304":
          description: The data has not changed (checked by `If-None-Match`).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [sources]
      operationId: sources_apply
      summary: Apply source definitions
      description: |
        The request body is an array of definitions in the form of
        the import file's root `sources` section. The
        `code`/`title`/`type` fields are mandatory. The format reader
        is the same, so duplicate keys and unknown fields are
        rejected.

        Applying works as an upsert by code: an existing definition
        is updated, and persons and links are replaced wholesale.
        Value validation is performed by the service layer: the code
        charset, the `source_types` dictionary, the year bounds
        1900–2100, and duplicate list entries.

        The response `{applied}` reflects the actual registry change.
        Re-applying without changes yields `false` and does not bump
        `data_revision` — idempotency, as in import.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              items: {$ref: "#/components/schemas/SourceDef"}
      responses:
        "200":
          description: |
            Apply outcome: a change or an idempotent no-op.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesApplyResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources/{code}:
    get:
      tags: [sources]
      operationId: sources_get
      summary: Source definition by code
      description: |
        The full bibliographic definition. The `type_name` field is
        localized. Unlike the card's `sources` section, it has no
        location note.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Source definition. The `type_name` field is
            filled per the request locale.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceDef"}
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [sources]
      operationId: sources_delete
      summary: Delete an unreferenced source
      description: |
        A source referenced by records (the record's `sources`
        section) is not deleted: the request fails with `409`
        `source_in_use`. References are record data, and there is no
        cascade. To delete such a source, remove the references by
        replacing the records' sections. Section replacement and
        record deletion clean up orphaned sources automatically.

        Deletion is atomic. It bumps `data_revision` without feed
        events — a registry change, as with applying definitions.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Source deleted. Persons and links are removed
            by cascade.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/suggest:
    get:
      tags: [service]
      operationId: suggest
      summary: Designation prefix autocomplete
      description: |
        Autocomplete can be disabled in the module configuration: the
        handler is not mounted, and the disabled route yields `404`.
        A repeated recognized parameter and an unknown query key fail
        with `400` `validation_failed` — typos are not silently
        ignored.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}, description: "Prefix of a designation or of a record's historical name (a synonym)."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SuggestResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/parse:
    get:
      tags: [service]
      operationId: parse
      summary: Designation parsing
      description: |
        The designation is parsed with the same strict grammars as
        the CLI `parse` command.

        Without the `system` parameter, autodetect runs in a fixed
        order: semiconductor `gost` → `pro` → `jedec` → `jis`,
        resistor `gost`/`ost`, capacitor `gost`. With the `system`
        parameter, parsing happens in the explicitly given system.
        For `other` the `kind` is mandatory, otherwise the request
        fails with `400` `kind_ambiguous`.

        The designation is canonicalized: case, whitespace, and
        typographic hyphens are insignificant. The `system`/`kind`
        parameters override autodetect. A contradiction yields `400`
        `designation_mismatch`.

        The response contains the kind, the system, the canonical
        designation, the parsed fields, and the candidates. The
        candidates are all successful strict parses in autodetect
        order, without duplicate kind/system pairs. With autodetect,
        the first candidate matches the main result. Strict grammars
        have no numeric confidence: the candidate list is its
        equivalent.

        Repeating any recognized parameter and an unknown query key
        fail with `400` `validation_failed` — typos are not silently
        ignored.
      parameters:
        - {name: designation, in: query, required: true, schema: {type: string}, description: "Designation (canonicalized)."}
        - {name: system, in: query, schema: {type: string, enum: [gost, ost, pro, jedec, jis, other]}, description: "Designation system. Without the parameter, autodetect is used."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind: overrides autodetect; mandatory for `system=other`."}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Designation parse with strict-system candidates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParseResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/import:
    post:
      tags: [import]
      operationId: import
      summary: Import a fill file (NDJSON, jsonc, yaml)
      description: |
        The request body is a fill file. The format is set by the
        mandatory `Content-Type` header:

        - `application/x-ndjson` — an NDJSON stream: one JSON line
          per entity, wrapper lines `{"<kind>": <record>}`, the
          `catalog` block as subsection lines before the records.
          The stream is read line by line, without loading the whole
          body and with no request size cap. Memory is bounded by the
          single-line cap (16 MiB). For larger volumes, NDJSON is the
          intended format;
        - `application/json` — a jsonc document, comments allowed;
        - `application/yaml` — a yaml document. Both documents are
          read in full with a 16 MiB body cap. Exceeding it yields
          `400` `invalid_import_file`.

        A missing or unsupported `Content-Type` fails with `400`
        `validation_failed`. Parameters of the `Content-Type` header
        (for example, charset) are allowed and ignored.

        The response is a synchronous report after EOF: outcome
        counters and the full list of run issues. The `Issues` model:
        valid records are applied in full, and records with errors
        are not applied at all. `200` is returned for runs with
        issues too. There is exactly one hard failure: format syntax
        and stream reading errors yield `400` `invalid_import_file`.

        The request accepts a single parameter, `dry_run`. With the
        value `true`, the import runs as a dry run: the validation
        pipeline is the same, nothing is written to the database, and
        the report is marked with `dry_run`. The value must be
        exactly `true` or `false`. Any other value, a repeated
        parameter, and any other query key fail with `400`
        `validation_failed`.

        No progress is reported over REST: the request is
        synchronous, and run observation is the site's metrics hook.
        Write access is mounted by the site only on protected
        routes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: dry_run, in: query, schema: {type: boolean, enum: [true, false], default: false}, description: "Dry run without writing to the database. The value must be exactly `true` or `false`."}
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: |
                An NDJSON stream — one JSON line per entity. There is
                no request size cap.
          application/json:
            schema:
              type: string
              description: A jsonc document, `//` comments allowed.
                The body is read in full, capped at 16 MiB.
          application/yaml:
            schema:
              type: string
              description: A yaml document. The body is read in full,
                capped at 16 MiB.
      responses:
        "200":
          description: Import run report. Issue messages (`message`)
            follow the request locale.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportReport"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  headers:
    VaryLanguage:
      description: |
        Always `Accept-Language`: the response representation is
        selected by the request locale. A cache must distinguish
        representations of different locales (RFC 9110/9111).
      schema: {type: string, const: Accept-Language}
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      description: Device kind code.
      schema: {type: string}
    Designation:
      name: designation
      in: path
      required: true
      description: URL-encoded designation.
      schema: {type: string}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: "Locale of the response display strings: q-values and the base subtag. `en` and `ru` are supported, `en` by default."
      schema: {type: string, examples: ["ru", "en-US,en;q=0.8"]}
  responses:
    BadRequest:
      description: Bad request (parameters/path/body syntax).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Not found.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflict (the record already exists).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: |
        The method is not supported by the route. The `Allow` header
        lists the allowed methods.
      headers:
        Allow:
          description: Comma-separated list of the route's allowed
            methods.
          schema: {type: string}
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: Semantic error of the record/designation.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Internal error.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code (Latin snake_case).
          examples: [validation_failed]
        message:
          type: string
          description: Message text per the request locale
            (`Accept-Language`). English is canonical.
    KindDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KindsResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
    Field:
      type: object
      required: [name]
      properties:
        name: {type: string}
        text: {type: string}
        num: {type: number}
    FieldValueDef:
      type: object
      description: |
        A value of a designation dictionary field. `code` is the
        stable code: the value of filters and the `fields` section.
        `name` is the display name per the request locale.
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    FieldDictionaries:
      type: object
      description: |
        Value dictionaries of the designation dictionary fields
        define the contents of the multi-select filters. The
        `material`/`subclass`/`adjustment` dictionaries are constant
        domain registries. The `category` dictionary is a catalog
        data dictionary, extended by import. Extensions without a bundle entry are
        displayed as their code. The value order is stable: domain
        registries and snapshot rows.
      required: [material, subclass, adjustment, category]
      properties:
        material:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        subclass:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        adjustment:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        category:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
    Condition:
      type: object
      required: [condition, value]
      properties:
        condition: {type: string, description: Measurement condition code.}
        value: {type: number}
    CardAttribute:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        text: {type: string}
        texts:
          type: array
          description: The note list of a `text_list` attribute in
            fill order. Omitted for scalar attributes.
          items: {type: string}
        num: {type: number}
        bool: {type: boolean}
    CardValue:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardGroup:
      type: object
      required: [code, section, name, values]
      properties:
        code: {type: string}
        section: {type: string, description: Fill file section name.}
        name: {type: string}
        values:
          type: array
          description: The values follow the catalog's canonical order
            (the parameter's `sort_order`). Same-name rows of one
            parameter keep fill order.
          items: {$ref: "#/components/schemas/CardValue"}
    CardVariant:
      type: object
      required: [label, attributes, groups]
      properties:
        label: {type: string}
        attributes:
          type: array
          description: Variant attributes — construction features.
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
    CardTypeSibling:
      type: object
      required: [id, system, designation]
      properties:
        id: {type: integer, format: int64}
        system: {type: string}
        designation: {type: string}
    CardTypeValue:
      type: object
      required: [designation]
      properties:
        designation: {type: string, description: Designation of a type-group record.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardTypeDiff:
      type: object
      required: [parameter, name, values]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        values:
          type: array
          description: Values per record of the group. A record
            without a value for the parameter has no cell.
          items: {$ref: "#/components/schemas/CardTypeValue"}
    CardTypeGroup:
      type: object
      required: [base, siblings, diffs]
      properties:
        base: {type: string, description: Base designation (type): the designation without the classification letter and tail elements.}
        siblings:
          type: array
          description: Sibling records of the same kind with the same type.
          items: {$ref: "#/components/schemas/CardTypeSibling"}
        diffs:
          type: array
          description: A mini difference matrix — the parameters whose
            values differ across the group's records (by type-level
            data).
          items: {$ref: "#/components/schemas/CardTypeDiff"}
    CardLink:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        note: {type: string}
    CardSynonym:
      type: object
      required: [designation]
      description: |
        A historical name of the record (a synonym): the designation
        under which the component was manufactured in other years
        (С5-35 = ПЭВ). The note holds the name's origin, and the
        years are the period of its use.
      properties:
        designation: {type: string}
        note: {type: string}
        year_from: {type: integer}
        year_to: {type: integer}
    CardSource:
      description: |
        A record data source: a book, a reference book, a datasheet, a
        standard, a specification (TU), an article, or a web page.
        Bibliographic texts are not localized. The `type_name` field
        is the localized display name of the type (`sourcetype.<code>`).
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      properties:
        code: {type: string}
        title: {type: string}
        type: {type: string}
        type_name: {type: string}
        authors:
          description: Authors. Order is significant.
          type: array
          items: {type: string}
        editors:
          description: Editors/compilers. Order is significant.
          type: array
          items: {type: string}
        year: {type: integer}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string}
        urls:
          description: |
            Links to the document: the original, mirrors, archived
            copies. The first entry is preferred.
          type: array
          items: {type: string}
        note:
          description: Location within the source (“table 5.3”, “p. 214”).
          type: string
    Card:
      type: object
      required: [id, kind, kind_name, system, system_name, designation, fields, attributes, groups, variants, manufacturers, analogs, backlinks, synonyms, sources]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        kind_name: {type: string}
        system: {type: string}
        system_name: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
        variants:
          type: array
          items: {$ref: "#/components/schemas/CardVariant"}
        type_group:
          description: Type group. Omitted when there are no sibling
            records with the same base designation.
          allOf: [{$ref: "#/components/schemas/CardTypeGroup"}]
        manufacturers:
          type: array
          items: {type: string}
        analogs:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        backlinks:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        synonyms:
          type: array
          items: {$ref: "#/components/schemas/CardSynonym"}
        sources:
          description: |
            Record data sources: the full bibliographic definition
            and the location note. The order is canonical, by code.
          type: array
          items: {$ref: "#/components/schemas/CardSource"}
    Outcome:
      type: string
      enum: [Added, UpdatedExisting, Skipped]
    UpsertResponse:
      type: object
      required: [outcome, card]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        card: {$ref: "#/components/schemas/Card"}
    SearchItem:
      type: object
      required: [id, kind, system, designation, fields]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        values:
          type: array
          description: |
            Values of the requested columns (the `values` parameter)
            in request order. For every code present on the record,
            an element of the `CardValue` schema is returned (no
            value — no element).
          items: {$ref: "#/components/schemas/CardValue"}
    SearchPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SearchItem"}
        total: {type: integer, description: Total number of records matching the filters.}
        limit: {type: integer}
        offset: {type: integer}
    SourceDef:
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      description: |
        A registry source definition: the shape of the `GET /sources`
        and `GET /sources/{code}` responses. The input fields of
        `POST /sources` are the same, except `type_name` — it is
        computed per the locale. Bibliographic texts are not
        localized. Only `type_name` is localized (the
        `sourcetype.<code>` bundle).
      properties:
        code:
          type: string
          description: Lowercase Latin letters/digits/underscore (the registry key).
        title: {type: string}
        type: {type: string, description: Code of the catalog source_types dictionary.}
        type_name: {type: string, description: Type name per the request locale. Not part of the POST /sources body.}
        authors:
          type: array
          items: {type: string}
        editors:
          type: array
          items: {type: string}
        year: {type: integer, description: Publication year 1900–2100.}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string, description: Canonicalized (spaces/hyphens removed).}
        urls:
          type: array
          items: {type: string}
          description: Original, mirrors, archived copies. Order is
            significant.
    SourcesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SourceDef"}
        total: {type: integer, description: Total number of sources matching the q filter.}
        limit: {type: integer}
        offset: {type: integer}
    SourcesApplyResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: boolean
          description: |
            The registry actually changed. The value `false` is an
            idempotent re-apply with no changes. `data_revision` is
            not bumped.
    Suggestion:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
    SuggestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Suggestion"}
    ParseCandidate:
      type: object
      required: [kind, system]
      description: A strict system that accepted the designation.
      properties:
        kind: {type: string}
        system: {type: string}
    ParseResponse:
      type: object
      required: [kind, system, designation, fields, candidates]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string, description: Canonical designation.}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        candidates:
          type: array
          description: |
            All successful strict parses in the fixed autodetect
            order, without duplicate kind/system pairs. With
            autodetect, the first element matches the main result.
            Strict grammars have no numeric confidence: the candidate
            list is its equivalent. The list is empty for designations
            outside the strict systems (explicit system `other`).
          items: {$ref: "#/components/schemas/ParseCandidate"}
    Stats:
      type: object
      required: [schema_version, catalog_revision, data_revision, total, kinds]
      properties:
        schema_version: {type: integer}
        catalog_revision: {type: integer, format: int64}
        data_revision: {type: integer, format: int64}
        total: {type: integer}
        kinds:
          type: object
          additionalProperties: {type: integer}
          description: Record counts by kind codes.
    ParameterStats:
      type: object
      description: Facet aggregates of a kind's parameter values.
      required: [kind, data_revision, parameters]
      properties:
        kind: {type: string}
        data_revision: {type: integer, format: int64, description: "Data revision consistent with the aggregates."}
        parameters:
          type: array
          description: The kind's parameters with data, alphabetically
            by code. Numeric ones yield `min`/`max`. Text and enum
            ones yield value frequencies.
          items: {$ref: "#/components/schemas/ParameterStat"}
    ParameterStat:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string, description: Display name per the request locale.}
        unit: {type: string, description: Canonical unit code.}
        min: {type: number, description: Lower bound of the parameter's values in the kind. Omitted when absent.}
        max: {type: number, description: Upper bound of the parameter's values in the kind. Omitted when absent.}
        values:
          type: array
          description: Frequencies of text and enum values. Numeric
            parameters produce none. The order is by descending
            frequency, then by text.
          items: {$ref: "#/components/schemas/ParameterValueFreq"}
    ParameterValueFreq:
      type: object
      required: [text, count]
      properties:
        text: {type: string}
        count: {type: integer, description: Number of records in the kind having the value.}
    ChangeEvent:
      type: object
      description: An event of an applied operation on a device record.
      required: [id, revision, op, kind, designation, device_id]
      properties:
        id: {type: integer, format: int64, description: Monotonic event id. Serves as the consumer's cursor.}
        revision: {type: integer, format: int64, description: The event transaction's data_revision (after the increment).}
        op: {type: string, enum: [created, updated, deleted]}
        kind: {type: string, description: The record's kind code.}
        designation: {type: string, description: Canonical designation.}
        device_id: {type: integer, format: int64, description: Stable record id.}
    ChangesResponse:
      type: object
      required: [events, data_revision]
      properties:
        events:
          type: array
          description: Events in ascending id order. The list may be
            empty.
          items: {$ref: "#/components/schemas/ChangeEvent"}
        data_revision: {type: integer, format: int64, description: "Current data revision, consistent with the page."}
    ImportIssue:
      type: object
      description: An import run issue. The position is given when
        defined.
      required: [code, message]
      properties:
        record: {type: string, description: Record designation. Omitted for root-level issues.}
        line: {type: integer, description: NDJSON line number. Omitted when undefined.}
        no: {type: integer, description: Ordinal record number within the document section. Omitted when unset.}
        code: {type: string, description: Machine-readable issue code.}
        message: {type: string, description: Message text per the request locale.}
    ImportReport:
      type: object
      description: Synchronous run report of POST /api/v1/import.
      required: [dry_run, records, added, updated, skipped, rejected, catalog_applied, sources_applied, issues]
      properties:
        dry_run: {type: boolean, description: Dry run without writing to the database.}
        records: {type: integer, description: Records in the body (including rejected ones).}
        added: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: "The merged state matches the current one: no database write and no revision increment."}
        rejected: {type: integer, description: "Records not applied due to issues."}
        catalog_applied: {type: boolean, description: "The catalog section was applied with an actual change. Re-importing an identical catalog yields false: catalog_revision is not incremented."}
        sources_applied: {type: boolean, description: "The source registry was changed by the root sources section: data_revision is incremented without change_events. A re-import with no changes yields false."}
        issues:
          type: array
          description: The full list of run issues (may be empty).
          items: {$ref: "#/components/schemas/ImportIssue"}
    DeviceRecord:
      description: |
        A fill record: a designation string or a “name/system +
        sections” object. Group sections are uniform lists of
        {parameter, value, conditions} objects. Conditions are given
        by adjacent keys, by code.

        Section semantics is common:

        - a section that is absent or `null` leaves the data
          unchanged;
        - a present section is replaced wholesale;
        - an empty section (`[]` or `{}`) clears the data.
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name: {type: string, description: Designation.}
            system: {type: string, description: "Designation system. Mandatory for `other`."}
            fields:
              type: object
              description: |
                Explicit classification fields: a “field code →
                dictionary value” object. The `assembly` field takes
                a number 0 or 1. The section sets only the fields that the record's
                designation-system parser does not set itself, and
                only those applicable to the kind. Replaced wholesale.
              additionalProperties: {oneOf: [{type: string}, {type: number}]}
            attributes:
              type: object
              description: "Attribute code → value: a string, an array
                of strings for text_list attributes, a number, or a
                boolean. A null value leaves the attribute unset."
            manufacturers:
              type: array
              items: {type: string}
            variants:
              type: array
              items: {$ref: "#/components/schemas/DeviceVariant"}
            analogs:
              type: array
              description: |
                Outgoing directed analog links: designations of the
                same kind or objects with a note on the nature of the
                substitution. The section is replaced wholesale. Only
                this record's outgoing links change: other records'
                links to it are not affected. The designation
                is canonicalized and must exist in the same kind,
                otherwise the request fails with `422`
                `unknown_analog`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
            synonyms:
              type: array
              description: |
                Historical names of the record. A synonym designation
                is not a record: find and search (`q=`) resolve it to
                the owning record. Synonyms are unique within a kind.
                Creating a record with a designation taken by another
                record's synonym yields a conflict (`409`). Years are
                integers 1949–2100, with `yearFrom` preceding
                `yearTo`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
                      yearFrom: {type: integer}
                      yearTo: {type: integer}
            sources:
              type: array
              description: |
                References to the record's data sources: registry code
                strings or objects with a code and a location note.
                The section is replaced wholesale. The code must exist
                in the registry (definitions come from the import
                file's root `sources` section), otherwise the request
                fails with `422` `unknown_source`.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [code]
                    properties:
                      code: {type: string}
                      note: {type: string}
    DeviceVariant:
      type: object
      properties:
        label: {type: string}
        attributes:
          type: object
          description: "Attribute code → variant value: construction
            features that differ across variants. The value shape is
            a string, an array of strings for text_list attributes, a
            number, or a boolean, as in the record's attributes. A
            null value leaves the attribute unset. The values are
            replaced together with the `variants` set."
    UnitDef:
      type: object
      required: [code, name, symbol]
      properties:
        code: {type: string}
        name: {type: string}
        symbol: {type: string}
    ConditionDef:
      type: object
      required: [code, name, allow_negative]
      properties:
        code: {type: string}
        name: {type: string}
        unit: {type: string}
        allow_negative: {type: boolean}
    GroupDef:
      type: object
      required: [code, section, name, sort_order]
      properties:
        code: {type: string}
        section: {type: string}
        name: {type: string}
        sort_order: {type: integer}
    ConditionSetItem:
      type: object
      required: [condition, mode]
      properties:
        condition: {type: string}
        mode: {type: string, enum: [required, optional]}
        fixed_value: {type: number}
    ConditionSet:
      type: object
      required: [no, items]
      properties:
        no: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/ConditionSetItem"}
    ParameterDef:
      type: object
      required: [code, group, name, value_type, allow_negative, sort_order, is_active, kinds, enum_values, condition_sets]
      properties:
        code: {type: string}
        group: {type: string}
        name: {type: string}
        unit: {type: string}
        value_type: {type: string, enum: [exact, at_least, at_most, range, limits, text, enum]}
        ceiling: {type: number}
        allow_negative: {type: boolean}
        validation_rule: {type: string}
        priority:
          type: string
          enum: [primary, secondary, tertiary]
          description: Parameter significance grade. Absent — unset;
            ranked as `secondary`. On import, an existing row keeps
            its current grade.
        sort_order: {type: integer, description: Order within the significance grade.}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
          description: An empty list — applicable to all kinds.
        enum_values:
          type: array
          items: {type: string}
        condition_sets:
          type: array
          items: {$ref: "#/components/schemas/ConditionSet"}
    AttributeDef:
      type: object
      required: [code, name, type, sort_order, is_active, kinds, enum_values]
      properties:
        code: {type: string}
        name: {type: string}
        group: {type: string}
        type: {type: string, enum: [text, text_list, bool, int, number, enum]}
        unit: {type: string}
        validation_rule: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
        enum_values:
          type: array
          items: {type: string}
    SystemDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
    SystemKindRef:
      type: object
      required: [system, kind]
      properties:
        system: {type: string}
        kind: {type: string}
    RuleDef:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    KindRuleRef:
      type: object
      required: [kind, rule]
      properties:
        kind: {type: string}
        rule: {type: string}
    CatalogSnapshot:
      type: object
      required: [revision, kinds, systems, system_kinds, units, conditions, groups, parameters, attributes, rules, kind_rules, dictionaries]
      properties:
        revision: {type: integer, format: int64, description: catalog_revision.}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
        systems:
          type: array
          items: {$ref: "#/components/schemas/SystemDef"}
        system_kinds:
          type: array
          items: {$ref: "#/components/schemas/SystemKindRef"}
        units:
          type: array
          items: {$ref: "#/components/schemas/UnitDef"}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/ConditionDef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupDef"}
        parameters:
          type: array
          items: {$ref: "#/components/schemas/ParameterDef"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/AttributeDef"}
        rules:
          type: array
          items: {$ref: "#/components/schemas/RuleDef"}
        kind_rules:
          type: array
          items: {$ref: "#/components/schemas/KindRuleRef"}
        dictionaries:
          $ref: "#/components/schemas/FieldDictionaries"
