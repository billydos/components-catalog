openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: components-catalog REST API
  version: 0.1.0
  description: |
    An embeddable electronic components reference: the REST /api/v1 is a
    thin transport over the Go library's service layer. Authentication,
    authorization, and rate limiting belong to the hosting site that
    mounts the handler (protected routes are the site's choice).
    Transport: JSON, UTF-8.

    Errors use the `{"code", "message"}` model: `code` is a
    machine-readable Latin snake_case string; `message` is the message
    text from the module's catalog per the request locale (en is
    canonical, ru is a bundle; Accept-Language). Statuses: 400 (bad
    request), 404 (not found), 405 (method not supported by the route;
    the Allow header lists the allowed ones), 409 (conflict),
    422 (record semantics), 500 (internal error). An unknown route —
    404 api_route_not_found in the same error model.

    Localization (D9): the module's database is language-neutral — the
    code fields of responses (kind, system, unit, parameter, attribute,
    section) are always canonical. Display fields (`name`, `kind_name`,
    `system_name`, descriptions, unit names and symbols in /catalog) are
    filled per the request locale from the module's bundles; the locale
    comes from the Accept-Language header (q-values, base subtag); the
    default and the fallback for unsupported languages is en (en and ru
    are supported).

    Section semantics of the record body (attributes, group sections,
    manufacturers, variants, analogs, synonyms, sources): absent/null —
    leave unchanged (for POST — unset); present — replace wholesale;
    `[]`/`{}` — clear; an error in any value — the record is not applied
    at all. sources references address codes of the global source
    registry (plan 03 §13); registry definitions come from the import
    file's root sources section and POST /api/v1/sources, not from the
    record body.
servers: []
tags:
  - name: catalog
    description: Module reference data (kinds, catalog).
  - name: components
    description: "Device records: search, card, write, delete."
  - name: sources
    description: "Record data source registry (D13): read, apply, delete."
  - name: service
    description: Auxiliary data (stats, autocomplete).
  - name: import
    description: "Fill file import: NDJSON stream."
paths:
  /api/v1/kinds:
    get:
      tags: [catalog]
      operationId: kinds
      summary: Device kinds
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Device kinds (name is localized per the request locale).
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KindsResponse"}
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/catalog:
    get:
      tags: [catalog]
      operationId: catalog
      summary: Catalog snapshot
      description: |
        Parameters, attributes, conditions, units, groups, designation
        systems, families, and the value dictionaries of the designation
        dictionary fields (material, subclass, adjustment, category) —
        for building forms and filters. Field keys mirror the fill format
        (snake_case after catalog table columns); display strings (name,
        descriptions, unit names and symbols) follow the request locale
        (D9). The ETag is derived from catalog_revision and the
        representation locale (different locales — different ETags,
        RFC 9110): the snapshot is cached until the catalog changes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Catalog snapshot.
          headers:
            ETag:
              description: Strong ETag of the form "catalog-<catalog_revision>-<locale>".
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogSnapshot"}
        "304":
          description: The snapshot has not changed (If-None-Match).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/stats:
    get:
      tags: [service]
      operationId: stats
      summary: Record counts, schema version, revisions; with kind — kind parameter aggregates
      description: |
        Without kind — module aggregates: record counts by kind, schema
        version, revisions. With kind — facet aggregates of the kind's
        parameter values: min/max of numeric parameters for parametric
        filter sliders (bounds follow the search filter semantics:
        value_min/value_max and value_exact; at_least contributes only
        min, at_most — only max, limits — min and/or max as given) and
        frequencies of text/enum values — the number of records in the
        kind having the value (a value present in the type data and in
        several variants of one record counts once). The aggregates
        include type-level data and variant data — as in search filters;
        parameters without data in the kind and not applicable to the
        kind (D7; including those with data left over after the catalog
        changed applicability) are excluded from the response; the
        parameter order is alphabetical by code (as in /catalog), values —
        by descending frequency, then by text. The facet representation
        is cacheable: the ETag is derived from catalog_revision
        (parameter applicability), data_revision, the kind, and the
        locale; If-None-Match short-circuits to 304 before the aggregate
        read. A repeated recognized parameter or an unknown query key —
        400 validation_failed; an unknown kind — 400 validation_failed.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: kind, in: query, schema: {type: string}, description: "Kind code: the response is facet aggregates of this kind's parameter values (without the parameter or with an empty value — module aggregates)."}
      responses:
        "200":
          description: Module aggregates (without kind; no ETag — a cheap
            count, the revisions are in the response itself) or the kind's
            facet aggregates (with kind; name follows the request locale,
            unit is the canonical code, the response carries an ETag).
          headers:
            Vary:
              description: Accept-Language — on the response with kind (the
                representation is localized); not sent on module aggregates
                without kind.
              schema: {type: string, const: Accept-Language}
            ETag:
              description: Strong ETag of the form
                "stats-<catalog_revision>-<data_revision>-<kind>-<locale>" —
                only on the facet response (with kind).
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Stats"
                  - $ref: "#/components/schemas/ParameterStats"
        "304":
          description: The facet aggregates have not changed (If-None-Match;
            only the response with kind).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/changes:
    get:
      tags: [service]
      operationId: changes
      summary: Record change event stream (change feed)
      description: |
        Incremental synchronization of the site's derived indexes: events
        of applied record operations (created/updated/deleted, kind,
        designation, stable record id) in ascending event id order.
        Events are written by the same transaction that changes the data:
        the event and the change are atomic; a Skipped outcome leaves no
        event (including importer compensating deletions — a regular
        deleted event).

        The cursor is the after parameter: the id of the last event
        received (after=0 — from the feed start); a revision cannot serve
        as the cursor: its relation to events is a write-path detail
        (several events in one transaction are possible, as is a revision
        increment with no event); the id is assigned on insert and remains
        a dense monotonic cursor. The response carries the current
        data_revision (consistent with the event page). The feed covers
        only data changes (data_revision); catalog changes
        (catalog_revision) are not in the feed — for those, use the ETag
        of GET /catalog. There are no actors and no before/after states —
        this is not an audit (change history is the site's domain). There
        is no automatic retention: growth is bounded by the scale of
        editorial activity; cleanup is manual (SQL), with no REST cleanup
        route. A
        repeated recognized parameter or an unknown query key — 400
        validation_failed.
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}, description: "Cursor: the id of the last event received (0 — from the feed start)."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}, description: "Number of events in the page (≤ 1000)."}
      responses:
        "200":
          description: A page of events and the current data_revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangesResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components:
    get:
      tags: [components]
      operationId: components_list
      summary: Search records
      description: |
        Designation substring, system, a stable-id set filter,
        field/attribute/parameter filters, sorting, pagination. The
        response is a list with designation, kind, system, and key
        fields; the ETag is derived from data_revision, the canonical
        query string, and the representation locale (different
        filters/sorts or locales — different ETags, RFC 9110). Repeating
        any query parameter — 400 validation_failed; the exceptions are
        the intentionally repeatable id (a filter set, up to 200 values),
        the dictionary filters material/subclass/adjustment/category
        (multi-select with OR semantics within a field), and values (the
        value columns of result rows).

        Besides the parameters listed above, the following are accepted:

        * designation field filters — the field code as the parameter
          name: textual `material`, `subclass`, `letters`, `construction`,
          `prefix`, `family`, `series`, `adjustment`, `category`, `base`
          (the type — the record's base designation, the value is
          canonicalized as a designation); numeric `junctions`, `group`,
          `dev_number`, `assembly`, `feature`, `modification`, `chip`
          (equality); the values of the dictionary fields `material`
          (`si`, `ge`, `ga`, `in`, `sic`, `other`, `gaas`), `subclass`
          (`bjt`, `zener`, …), `adjustment` (`fixed`, `variable`,
          `preset`), and `category` (catalog dictionary codes — the
          `dictionaries` section of GET /catalog) — a stable dictionary
          code or a localized display name (canonicalized; D9);
          dictionary fields are repeatable: each value is canonicalized
          separately, the set has OR semantics, a duplicate canonical
          code — 400 validation_failed; the other text fields are
          normative elements of the designation (for `other` records the
          `series` field is set by the `fields` section);
        * `attr.<code>=<value>` — attribute filter (text or number per
          the attribute type; boolean attributes cannot be filtered; a
          text filter on a text_list attribute — equality to any element
          of the list);
        * `par.<code>.min=`, `par.<code>.max=`, `par.<code>.exact=` —
          the bounds of a numeric parameter; `par.<code>.text=` or
          `par.<code>=<text>` — text/enum.

        Variant parametric filters apply within a single variant. A
        filter on a parameter/attribute not applicable to the queried
        kind — 400 parameter_not_applicable/attribute_not_applicable.
        An unknown query parameter — 400 validation_failed.
      parameters:
        - {name: kind, in: query, schema: {type: string}, description: "Device kind (transistor, diode, resistor, capacitor, relay)."}
        - {name: system, in: query, schema: {type: string}, description: "Designation system (gost, ost, pro, jedec, jis, other)."}
        - {name: q, in: query, schema: {type: string}, description: "Substring of a designation or of a record's historical name — a synonym (case-insensitive)."}
        - name: id
          in: query
          description: |
            Filter by a set of stable record ids — an intentionally
            repeatable parameter (one of the query strictness exceptions —
            the other one, the multi-select dictionary filters, is
            described above): up to 200 values, each a positive integer;
            a duplicate value — 400 validation_failed. The semantics is
            intersection with the other filters; an id without a record
            or one cut off by the other filters simply yields no row (no
            separate error). Without sort the output order follows the id
            transmission order (with sort — the requested sorting). Use
            case: a composite search of “site-side preselection × module
            parametrics” without duplicating the catalog.
          schema:
            type: array
            items: {type: integer, format: int64, minimum: 1}
            minItems: 1
            maxItems: 200
            uniqueItems: true
          style: form
          explode: true
        - name: values
          in: query
          description: |
            The value columns of result rows — an intentionally repeatable
            parameter: a catalog parameter code or attr.<attribute code>,
            up to 16 codes; a duplicate — 400 validation_failed. The value
            is a CardValue-shaped element for every code present on the
            record (no value — no element), in request order: name follows
            the request locale, unit is the canonical unit code, conditions
            — parameters only. The value selection rule when a record has
            several rows (type data + variants): numeric — a MIN/MAX
            bounds aggregate (a single row keeps its
            exact/at_least/at_most/limits shape); text/enum — type data
            over variants. Boolean attributes — 400 validation_failed; an
            unknown code — 400 unknown_parameter/unknown_attribute; one
            not applicable to the queried kind — 400
            parameter_not_applicable/attribute_not_applicable (as with
            filters).
          schema:
            type: array
            items: {type: string, minLength: 1}
            minItems: 1
            maxItems: 16
          style: form
          explode: true
        - name: sort
          in: query
          schema: {type: string}
          description: |
            Comma-separated sort keys, “-” for descending: designation,
            id, a parsed-field code, or the code of a numeric catalog
            parameter applicable to the queried kind. text/enum parameters
            and ones not applicable to the kind — 400
            (validation_failed/parameter_not_applicable). A record's value
            for a parameter is direction-dependent: ascending — the lower
            bound (value_min, exact, or the sole upper bound); descending
            — the upper bound (value_max, exact, or the sole lower bound);
            type-level and variant values are both considered (as in
            filters); records without a value go last regardless of
            direction. A
            final (kind, designation) ordering is appended to any order.
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Page size (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Page offset."}
      responses:
        "200":
          description: A page of results.
          headers:
            ETag:
              description: |
                Strong ETag of the form "data-<data_revision>-<hash>-<locale>":
                hash is a hash of the canonical query string (parameter
                names sorted, name=value pairs joined with “&”; the
                repeatable id contributes each of its values — order is
                significant).
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchPage"}
        "304":
          description: The data has not changed (If-None-Match).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [components]
      operationId: components_create
      summary: Create a record
      description: |
        The body is a fill record: a designation string or a
        “name/system + sections” object. The kind is determined by
        designation autodetect; for system `other`, creation is
        addressed by PUT with the kind in the path. An existing
        (kind, designation) — 409 already_exists without modifying the
        record (creation is atomic; a race of concurrent POSTs does not
        apply sections to someone else's record).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A rare race — the record was deleted between applying
            and reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/id/{id}:
    get:
      tags: [components]
      operationId: components_by_id
      summary: Card by stable id
      description: Designations containing "/" (MIL names) are addressed by
        this route or by search — a direct route is not guaranteed for them.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/{kind}/{designation}:
    get:
      tags: [components]
      operationId: components_get
      summary: Record card
      description: |
        Designation + system + parsed fields, attributes, parameter values
        by groups with conditions, variants (a “nominal × voltage →
        dimensions/mass” matrix), analogs (outgoing and backlinks),
        manufacturers. The designation in the path is URL-encoded.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [components]
      operationId: components_put
      summary: Record upsert with section semantics
      description: |
        The body is a fill record (name/system + sections); name must
        match the path designation (otherwise 422 designation_mismatch).
        The kind is set by the path (overriding autodetect — the way to
        create records of system `other`). Outcomes: Added (created),
        UpdatedExisting (updated), Skipped (the merged state is identical
        — no database write and no revision increment).
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "200":
          description: Record applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A rare race — the record was deleted between applying
            and reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [components]
      operationId: components_delete
      summary: Delete a record (cascade)
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Record deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources:
    get:
      tags: [sources]
      operationId: sources_list
      summary: Source registry page
      description: |
        The record data source registry (plan 03 §13, D13) ordered by
        code: pagination and substring search over code/title
        (case-insensitive; PostgreSQL folds case across all alphabets,
        SQLite only Latin: Cyrillic titles on SQLite are matched with
        exact case). Persons (authors/editors) and links are read only
        for the page rows. The ETag is derived from data_revision, the
        canonical query string, and the representation locale (as in
        GET /components; registry changes bump data_revision). A repeated
        recognized parameter or an unknown query key — 400
        validation_failed. Reading the full registry is an export concern
        (the Go API ListSources), not REST.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: q, in: query, schema: {type: string}, description: "Substring over the source code or title (without q — the whole registry, paginated)."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Page size (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Page offset."}
      responses:
        "200":
          description: Registry page (type_name follows the request locale).
          headers:
            ETag:
              description: |
                Strong ETag of the form "data-<data_revision>-<hash>-<locale>":
                hash is a hash of the canonical query string (as in search).
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesPage"}
        "304":
          description: The data has not changed (If-None-Match).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [sources]
      operationId: sources_apply
      summary: Apply source definitions
      description: |
        The body is an array of definitions in the form of the import
        file's root sources section (code/title/type are mandatory; the
        same format reader — duplicate keys and unknown fields are
        rejected). Applying is an upsert by code: an existing definition
        is updated, persons and links are replaced wholesale; value
        validation (the code charset, the source_types dictionary, year
        bounds 1900–2100, duplicate list entries) is the service layer's.
        The response {applied} is the actual registry change: re-applying
        without changes — false, data_revision is not bumped
        (idempotency, as in import).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              items: {$ref: "#/components/schemas/SourceDef"}
      responses:
        "200":
          description: Apply outcome (a change or an idempotent no-op).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesApplyResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/sources/{code}:
    get:
      tags: [sources]
      operationId: sources_get
      summary: Source definition by code
      description: The full bibliographic definition with a localized
        type_name (as in the card sources section, without the location note).
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Source definition (type_name follows the request locale).
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceDef"}
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [sources]
      operationId: sources_delete
      summary: Delete an unreferenced source
      description: |
        A source referenced by records (the record's sources section)
        is not deleted — 409 source_in_use: references are record data,
        there is no cascade (remove the references by replacing the
        records' sections; section replacement and record deletion clean
        up orphaned sources automatically). Deletion is atomic and bumps
        data_revision without feed events — registry changes, as with
        applying definitions.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Source deleted (persons and links cascade).
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/suggest:
    get:
      tags: [service]
      operationId: suggest
      summary: Designation prefix autocomplete
      description: Can be disabled in the module configuration — the handler
        is not mounted (404 when disabled). A repeated recognized parameter
        or an unknown query key — 400 validation_failed (typos are not
        silently ignored).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}, description: "Prefix of a designation or of a record's historical name — a synonym."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SuggestResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/parse:
    get:
      tags: [service]
      operationId: parse
      summary: Designation parsing
      description: |
        Parses the designation with the same strict grammars as CLI
        parse: without system — autodetect (fixed order: semiconductor
        gost → pro → jedec → jis → resistor gost/ost → capacitor gost);
        with system — parsing in the explicit system (for `other` the kind
        is mandatory, otherwise 400 kind_ambiguous). The designation is
        canonicalized (case, whitespace, and typographic hyphens are
        insignificant); system/kind override autodetect, a contradiction
        — 400 designation_mismatch. The response is the kind, system,
        canonical designation, parsed fields, and candidates: all
        successful strict parses in autodetect order without duplicate
        kind/system pairs (with autodetect, the first candidate matches
        the main result). Strict grammars have no numeric confidence —
        the candidate list is its equivalent. Repeating any recognized
        query parameter or an unknown query key — 400 validation_failed
        (typos are not silently ignored).
      parameters:
        - {name: designation, in: query, required: true, schema: {type: string}, description: "Designation (canonicalized)."}
        - {name: system, in: query, schema: {type: string, enum: [gost, ost, pro, jedec, jis, other]}, description: "Designation system; without the parameter — autodetect."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind (overrides autodetect; mandatory for system=other)."}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Designation parse with strict-system candidates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParseResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/import:
    post:
      tags: [import]
      operationId: import
      summary: Import a fill file (NDJSON, jsonc, yaml)
      description: |
        The body is a fill file; the format is set by the mandatory
        Content-Type header: application/x-ndjson — an NDJSON stream
        (one JSON line per entity: wrapper lines `{"<kind>": <record>}`,
        the catalog block as subsection lines before the records;
        plan 04 §4) is read streaming, without loading the whole body
        and with no request size cap — memory is bounded by the
        single-line cap (16 MiB); application/json (jsonc, comments
        allowed) and application/yaml — the document is read in full
        with a 16 MiB body cap (exceeding it — 400 invalid_import_file;
        for larger volumes use NDJSON). A missing or unsupported
        Content-Type — 400 validation_failed; Content-Type parameters
        (charset) are allowed and ignored. The response is a synchronous
        report after EOF: outcome counters and the full list of run
        issues (the Issues model: valid records are applied, invalid
        ones are not, and a record is never applied partially); 200 is
        returned for runs with issues too. The only hard failure is
        format syntax and stream reading (400 invalid_import_file).
        The only query parameter is dry_run=true: a dry run of the same
        validation pipeline without writing to the database (the report
        is marked dry_run); the value must be exactly true or false
        (anything else and a repeated parameter — 400
        validation_failed), other keys — 400. No progress is reported
        over REST — the request is synchronous (run observation is the
        site's metrics hook); write access is mounted by the site only
        on protected routes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: dry_run, in: query, schema: {type: boolean, enum: [true, false], default: false}, description: "Dry run without writing to the database (the value must be exactly true or false)."}
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: An NDJSON stream — one JSON line per entity;
                no request size cap.
          application/json:
            schema:
              type: string
              description: A jsonc document (// comments allowed); the
                body is read in full, capped at 16 MiB.
          application/yaml:
            schema:
              type: string
              description: A yaml document; the body is read in full,
                capped at 16 MiB.
      responses:
        "200":
          description: Import run report (issue messages follow the
            request locale).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportReport"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  headers:
    VaryLanguage:
      description: Always Accept-Language — the response representation is
        selected by the request locale (D9); a cache must distinguish
        representations of different locales (RFC 9110/9111).
      schema: {type: string, const: Accept-Language}
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      description: Device kind code.
      schema: {type: string}
    Designation:
      name: designation
      in: path
      required: true
      description: URL-encoded designation.
      schema: {type: string}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: "Locale of the response display strings (D9): q-values, base subtag; en and ru are supported; en by default."
      schema: {type: string, examples: ["ru", "en-US,en;q=0.8"]}
  responses:
    BadRequest:
      description: Bad request (parameters/path/body syntax).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Not found.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflict (the record already exists).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: The method is not supported by the route (the Allow
        header lists the route's allowed methods).
      headers:
        Allow:
          description: Comma-separated list of the route's allowed methods.
          schema: {type: string}
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: Semantic error of the record/designation.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Internal error.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code (Latin snake_case).
          examples: [validation_failed]
        message:
          type: string
          description: Message text per the request locale (Accept-Language;
            en is canonical).
    KindDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KindsResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
    Field:
      type: object
      required: [name]
      properties:
        name: {type: string}
        text: {type: string}
        num: {type: number}
    FieldValueDef:
      type: object
      description: A designation dictionary field value — the stable code
        (the value of filters and the fields section) and the display
        name per the request locale (D9).
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    FieldDictionaries:
      type: object
      description: |
        Value dictionaries of the designation dictionary fields — the
        contents of the multi-select filters: material/subclass/adjustment
        are constant domain registries; category is a catalog data
        dictionary (extended by import; extensions without a bundle entry
        are displayed as their code). The value order is stable (domain
        registries and snapshot rows).
      required: [material, subclass, adjustment, category]
      properties:
        material:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        subclass:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        adjustment:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        category:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
    Condition:
      type: object
      required: [condition, value]
      properties:
        condition: {type: string, description: Measurement condition code.}
        value: {type: number}
    CardAttribute:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        text: {type: string}
        texts:
          type: array
          description: The note list of a text_list attribute (fill order
            preserved); omitted for scalar attributes.
          items: {type: string}
        num: {type: number}
        bool: {type: boolean}
    CardValue:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardGroup:
      type: object
      required: [code, section, name, values]
      properties:
        code: {type: string}
        section: {type: string, description: Fill file section name.}
        name: {type: string}
        values:
          type: array
          description: Values in the catalog's canonical order (parameter
            sort_order); same-name rows of one parameter keep fill order.
          items: {$ref: "#/components/schemas/CardValue"}
    CardVariant:
      type: object
      required: [label, attributes, groups]
      properties:
        label: {type: string}
        attributes:
          type: array
          description: Variant attributes — construction features.
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
    CardTypeSibling:
      type: object
      required: [id, system, designation]
      properties:
        id: {type: integer, format: int64}
        system: {type: string}
        designation: {type: string}
    CardTypeValue:
      type: object
      required: [designation]
      properties:
        designation: {type: string, description: Designation of a type-group record.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardTypeDiff:
      type: object
      required: [parameter, name, values]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        values:
          type: array
          description: Values per record of the group (a record without a
            value for the parameter has no cell).
          items: {$ref: "#/components/schemas/CardTypeValue"}
    CardTypeGroup:
      type: object
      required: [base, siblings, diffs]
      properties:
        base: {type: string, description: Base designation (type) — the designation without the classification letter and tail elements.}
        siblings:
          type: array
          description: Sibling records of the same kind with the same type.
          items: {$ref: "#/components/schemas/CardTypeSibling"}
        diffs:
          type: array
          description: A mini difference matrix — the parameters whose
            values differ across the group's records (type-level data).
          items: {$ref: "#/components/schemas/CardTypeDiff"}
    CardLink:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        note: {type: string}
    CardSynonym:
      type: object
      required: [designation]
      description: |
        A historical name of the record (synonym): the designation under
        which the component was manufactured in other years (С5-35 = ПЭВ);
        the note is the name's origin, the years are the period of its use.
      properties:
        designation: {type: string}
        note: {type: string}
        year_from: {type: integer}
        year_to: {type: integer}
    CardSource:
      description: A record data source (plan 03 §13) — a book, reference
        book, datasheet, standard, specification (TU), article, or web
        page; bibliographic texts are non-localizable data, type_name is
        the localized display name of the type (sourcetype.<code>).
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      properties:
        code: {type: string}
        title: {type: string}
        type: {type: string}
        type_name: {type: string}
        authors:
          description: Authors; order is significant.
          type: array
          items: {type: string}
        editors:
          description: Editors/compilers; order is significant.
          type: array
          items: {type: string}
        year: {type: integer}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string}
        urls:
          description: Links to the document (original, mirrors, archived
            copies; the first entry is preferred).
          type: array
          items: {type: string}
        note:
          description: Location within the source (“table 5.3”, “p. 214”).
          type: string
    Card:
      type: object
      required: [id, kind, kind_name, system, system_name, designation, fields, attributes, groups, variants, manufacturers, analogs, backlinks, synonyms, sources]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        kind_name: {type: string}
        system: {type: string}
        system_name: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
        variants:
          type: array
          items: {$ref: "#/components/schemas/CardVariant"}
        type_group:
          description: Type group (omitted when there are no sibling
            records with the same base designation).
          allOf: [{$ref: "#/components/schemas/CardTypeGroup"}]
        manufacturers:
          type: array
          items: {type: string}
        analogs:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        backlinks:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        synonyms:
          type: array
          items: {$ref: "#/components/schemas/CardSynonym"}
        sources:
          description: Record data sources (plan 03 §13) — the full
            bibliographic definition and the location note; the order is
            canonical, by code.
          type: array
          items: {$ref: "#/components/schemas/CardSource"}
    Outcome:
      type: string
      enum: [Added, UpdatedExisting, Skipped]
    UpsertResponse:
      type: object
      required: [outcome, card]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        card: {$ref: "#/components/schemas/Card"}
    SearchItem:
      type: object
      required: [id, kind, system, designation, fields]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        values:
          type: array
          description: Values of the requested columns (the values
            parameter) in request order; a CardValue-shaped element for
            every code present on the record (no value — no element).
          items: {$ref: "#/components/schemas/CardValue"}
    SearchPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SearchItem"}
        total: {type: integer, description: Total number of records matching the filters.}
        limit: {type: integer}
        offset: {type: integer}
    SourceDef:
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      description: |
        A registry source definition (plan 03 §13): the responses of
        GET /sources and GET /sources/{code} (the SourceDef fields of
        the POST /sources input are the same, except type_name — it is
        computed per the locale). Bibliographic texts are non-localizable
        data (D9); only type_name is localized (the sourcetype.<code>
        bundle).
      properties:
        code:
          type: string
          description: Lowercase Latin letters/digits/underscore (the registry key).
        title: {type: string}
        type: {type: string, description: Code of the catalog source_types dictionary.}
        type_name: {type: string, description: Type name per the request locale (not part of the POST /sources body).}
        authors:
          type: array
          items: {type: string}
        editors:
          type: array
          items: {type: string}
        year: {type: integer, description: Publication year 1900–2100.}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string, description: Canonicalized (spaces/hyphens removed).}
        urls:
          type: array
          items: {type: string}
          description: Original, mirrors, archived copies; order is significant.
    SourcesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SourceDef"}
        total: {type: integer, description: Total number of sources matching the q filter.}
        limit: {type: integer}
        offset: {type: integer}
    SourcesApplyResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: boolean
          description: The registry actually changed (false — an idempotent
            re-apply with no changes; data_revision is not bumped).
    Suggestion:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
    SuggestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Suggestion"}
    ParseCandidate:
      type: object
      required: [kind, system]
      description: A strict system that accepted the designation.
      properties:
        kind: {type: string}
        system: {type: string}
    ParseResponse:
      type: object
      required: [kind, system, designation, fields, candidates]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string, description: Canonical designation.}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        candidates:
          type: array
          description: |
            All successful strict parses in the fixed autodetect order
            without duplicate kind/system pairs; with autodetect the first
            element matches the main result. Strict grammars have no
            numeric confidence — the candidate list is its equivalent.
            Empty for designations outside the strict systems (explicit
            system other).
          items: {$ref: "#/components/schemas/ParseCandidate"}
    Stats:
      type: object
      required: [schema_version, catalog_revision, data_revision, total, kinds]
      properties:
        schema_version: {type: integer}
        catalog_revision: {type: integer, format: int64}
        data_revision: {type: integer, format: int64}
        total: {type: integer}
        kinds:
          type: object
          additionalProperties: {type: integer}
          description: Record counts by kind codes.
    ParameterStats:
      type: object
      description: Facet aggregates of a kind's parameter values.
      required: [kind, data_revision, parameters]
      properties:
        kind: {type: string}
        data_revision: {type: integer, format: int64, description: "Data revision consistent with the aggregates."}
        parameters:
          type: array
          description: The kind's parameters with data, alphabetically by
            code; numeric — min/max, text/enum — value frequencies.
          items: {$ref: "#/components/schemas/ParameterStat"}
    ParameterStat:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string, description: Display name per the request locale.}
        unit: {type: string, description: Canonical unit code.}
        min: {type: number, description: Lower bound of the parameter's values in the kind (omitted when absent).}
        max: {type: number, description: Upper bound of the parameter's values in the kind (omitted when absent).}
        values:
          type: array
          description: Frequencies of text/enum values (numeric parameters
            produce none); by descending frequency, then by text.
          items: {$ref: "#/components/schemas/ParameterValueFreq"}
    ParameterValueFreq:
      type: object
      required: [text, count]
      properties:
        text: {type: string}
        count: {type: integer, description: Number of records in the kind having the value.}
    ChangeEvent:
      type: object
      description: An event of an applied operation on a device record.
      required: [id, revision, op, kind, designation, device_id]
      properties:
        id: {type: integer, format: int64, description: Monotonic event id — the consumer's cursor.}
        revision: {type: integer, format: int64, description: The event transaction's data_revision (after the increment).}
        op: {type: string, enum: [created, updated, deleted]}
        kind: {type: string, description: The record's kind code.}
        designation: {type: string, description: Canonical designation.}
        device_id: {type: integer, format: int64, description: Stable record id.}
    ChangesResponse:
      type: object
      required: [events, data_revision]
      properties:
        events:
          type: array
          description: Events in ascending id order (may be empty).
          items: {$ref: "#/components/schemas/ChangeEvent"}
        data_revision: {type: integer, format: int64, description: Current data revision (consistent with the page).}
    ImportIssue:
      type: object
      description: An import run issue (position — when defined).
      required: [code, message]
      properties:
        record: {type: string, description: Record designation (omitted for root-level issues).}
        line: {type: integer, description: NDJSON line number (omitted when undefined).}
        no: {type: integer, description: Ordinal record number within the document section (omitted when unset).}
        code: {type: string, description: Machine-readable issue code.}
        message: {type: string, description: Message text per the request locale.}
    ImportReport:
      type: object
      description: Synchronous run report of POST /api/v1/import.
      required: [dry_run, records, added, updated, skipped, rejected, catalog_applied, sources_applied, issues]
      properties:
        dry_run: {type: boolean, description: Dry run without writing to the database.}
        records: {type: integer, description: Records in the body (including rejected ones).}
        added: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: The merged state matches the current one — no database write and no revision increment.}
        rejected: {type: integer, description: "Records not applied due to issues."}
        catalog_applied: {type: boolean, description: "The catalog section was applied with an actual change (re-importing an identical catalog — false, catalog_revision is not incremented)."}
        sources_applied: {type: boolean, description: "The source registry was changed by the root sources section (a data_revision increment without change_events; a re-import with no changes — false)."}
        issues:
          type: array
          description: The full list of run issues (may be empty).
          items: {$ref: "#/components/schemas/ImportIssue"}
    DeviceRecord:
      description: |
        A fill record: a designation string or a “name/system + sections”
        object. Group sections are uniform lists of {parameter, value,
        conditions} objects; conditions are adjacent keys by code.
        Absent/null — leave unchanged; present — replace wholesale;
        []/{} — clear.
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name: {type: string, description: Designation.}
            system: {type: string, description: "Designation system; mandatory for `other`."}
            fields:
              type: object
              description: |
                Explicit classification fields (D10): a “field code →
                dictionary value” object (`assembly` is a number 0/1).
                Sets only the fields that the record's designation-system
                parser does not set itself, and only those applicable to
                the kind (docs/fill-format.md §5.1); replaced wholesale.
              additionalProperties: {oneOf: [{type: string}, {type: number}]}
            attributes:
              type: object
              description: "Attribute code → value (string / an array of
                strings for text_list attributes / number / boolean;
                null — the attribute is left unset)."
            manufacturers:
              type: array
              items: {type: string}
            variants:
              type: array
              items: {$ref: "#/components/schemas/DeviceVariant"}
            analogs:
              type: array
              description: |
                Outgoing directed analog links (plan 03 §8, D8):
                designations of the same kind or objects with a note on
                the nature of the substitution. Section semantics is the
                common one (wholesale replacement); the designation is
                canonicalized and must exist in the same kind, otherwise
                — 422 unknown_analog.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
            synonyms:
              type: array
              description: |
                Historical names of the record (D11): a synonym designation
                is not a record — find and search (q=) resolve it to the
                owning record. Unique within a kind; creating a record
                with a designation taken by another record's synonym is a
                conflict (409). Years are integers 1949–2100, with
                yearFrom preceding yearTo.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
                      yearFrom: {type: integer}
                      yearTo: {type: integer}
            sources:
              type: array
              description: |
                References to the record's data sources (plan 03 §13,
                D13): registry code strings or objects with a code and a
                location note. Section semantics is the common one
                (replaced wholesale); the code must exist in the registry
                (definitions come from the import file's root sources
                section), otherwise — 422 unknown_source.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [code]
                    properties:
                      code: {type: string}
                      note: {type: string}
    DeviceVariant:
      type: object
      properties:
        label: {type: string}
        attributes:
          type: object
          description: "Attribute code → variant value (construction
            features differing across variants — docs/fill-format.md §6):
            string / an array of strings for text_list attributes /
            number / boolean; the value shape is as in the record's
            attributes, null — the attribute is left unset; replaced
            together with the variants set."
    UnitDef:
      type: object
      required: [code, name, symbol]
      properties:
        code: {type: string}
        name: {type: string}
        symbol: {type: string}
    ConditionDef:
      type: object
      required: [code, name, allow_negative]
      properties:
        code: {type: string}
        name: {type: string}
        unit: {type: string}
        allow_negative: {type: boolean}
    GroupDef:
      type: object
      required: [code, section, name, sort_order]
      properties:
        code: {type: string}
        section: {type: string}
        name: {type: string}
        sort_order: {type: integer}
    ConditionSetItem:
      type: object
      required: [condition, mode]
      properties:
        condition: {type: string}
        mode: {type: string, enum: [required, optional]}
        fixed_value: {type: number}
    ConditionSet:
      type: object
      required: [no, items]
      properties:
        no: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/ConditionSetItem"}
    ParameterDef:
      type: object
      required: [code, group, name, value_type, allow_negative, sort_order, is_active, kinds, enum_values, condition_sets]
      properties:
        code: {type: string}
        group: {type: string}
        name: {type: string}
        unit: {type: string}
        value_type: {type: string, enum: [exact, at_least, at_most, range, limits, text, enum]}
        ceiling: {type: number}
        allow_negative: {type: boolean}
        validation_rule: {type: string}
        priority:
          type: string
          enum: [primary, secondary, tertiary]
          description: Parameter significance grade; omitted — unset (ranked
            as secondary; on import an existing row keeps its current
            grade).
        sort_order: {type: integer, description: Order within the significance grade.}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
          description: Empty — applicable to all kinds.
        enum_values:
          type: array
          items: {type: string}
        condition_sets:
          type: array
          items: {$ref: "#/components/schemas/ConditionSet"}
    AttributeDef:
      type: object
      required: [code, name, type, sort_order, is_active, kinds, enum_values]
      properties:
        code: {type: string}
        name: {type: string}
        group: {type: string}
        type: {type: string, enum: [text, text_list, bool, int, number, enum]}
        unit: {type: string}
        validation_rule: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
        enum_values:
          type: array
          items: {type: string}
    SystemDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
    SystemKindRef:
      type: object
      required: [system, kind]
      properties:
        system: {type: string}
        kind: {type: string}
    RuleDef:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    KindRuleRef:
      type: object
      required: [kind, rule]
      properties:
        kind: {type: string}
        rule: {type: string}
    CatalogSnapshot:
      type: object
      required: [revision, kinds, systems, system_kinds, units, conditions, groups, parameters, attributes, rules, kind_rules, dictionaries]
      properties:
        revision: {type: integer, format: int64, description: catalog_revision.}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
        systems:
          type: array
          items: {$ref: "#/components/schemas/SystemDef"}
        system_kinds:
          type: array
          items: {$ref: "#/components/schemas/SystemKindRef"}
        units:
          type: array
          items: {$ref: "#/components/schemas/UnitDef"}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/ConditionDef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupDef"}
        parameters:
          type: array
          items: {$ref: "#/components/schemas/ParameterDef"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/AttributeDef"}
        rules:
          type: array
          items: {$ref: "#/components/schemas/RuleDef"}
        kind_rules:
          type: array
          items: {$ref: "#/components/schemas/KindRuleRef"}
        dictionaries:
