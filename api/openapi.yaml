openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: components-catalog REST API
  version: 0.1.0
  description: |
    Embedded electronic components reference: REST /api/v1 — a thin
    transport over the service layer of a Go library. Authentication,
    authorization and rate limiting belong to the hosting site
    (protected routes are up to it). Transport: JSON, UTF-8.

    Errors use the `{"code", "message"}` model: `code` is a
    machine-readable snake_case Latin string, `message` is the message
    text from the module's message catalog in the request locale
    (en is canonical, ru is a bundle; Accept-Language). Statuses:
    400 (bad request), 404 (not found), 405 (method not supported
    for the path; the Allow header lists the allowed ones),
    409 (conflict), 422 (record semantics), 500 (internal error).
    An unknown path yields 404 api_route_not_found in the same
    error model.

    Localization (D9): the module's database is language-neutral —
    code fields of responses (kind, system, unit, parameter,
    attribute, section) are always canonical. Display fields (`name`,
    `kind_name`, `system_name`, descriptions, unit names and symbols
    in /catalog) are filled per the request locale from the module's
    bundles; the locale comes from the Accept-Language header
    (q-values, basic subtag), defaulting to en for unsupported
    languages (en and ru are supported).

    Section semantics of record body sections (attributes, group
    sections, manufacturers, variants, analogs, synonyms, sources):
    absent/null — leave unchanged (for POST — not set), present —
    replace entirely, `[]`/`{}` — clear, an error in any value — the
    record is not applied at all. Source references address codes of
    the global source registry of the fill file (plan 03 §13);
    registry definitions come from the root sources section of the
    import file, not from the record body.
servers: []
tags:
  - name: catalog
    description: Module reference dictionaries (kinds, catalog snapshot).
  - name: components
    description: "Device records: search, card, write, delete."
  - name: service
    description: Service endpoints (statistics, autocomplete).
  - name: import
    description: "Fill file import: NDJSON stream."
paths:
  /api/v1/kinds:
    get:
      tags: [catalog]
      operationId: kinds
      summary: Device kinds
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Device kinds (name is per the request locale).
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KindsResponse"}
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/catalog:
    get:
      tags: [catalog]
      operationId: catalog
      summary: Catalog snapshot
      description: |
        Parameters, attributes, measurement conditions, units, groups,
        designation systems, families, and value dictionaries of
        designation dictionary fields (material, subclass, adjustment,
        category) — for building forms and filters. Field keys mirror
        the fill format (snake_case over catalog table columns);
        display strings (name, descriptions, unit names and symbols)
        follow the request locale (D9). ETag is derived from
        catalog_revision and the representation locale (different
        locales — different ETags, RFC 9110): the snapshot is cached
        until the catalog changes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Catalog snapshot.
          headers:
            ETag:
              description: 'Strong ETag of the form "catalog-<catalog_revision>-<locale>".'
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogSnapshot"}
        "304":
          description: Snapshot unchanged (If-None-Match).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/stats:
    get:
      tags: [service]
      operationId: stats
      summary: Record counts, schema version, revisions; with kind — parameter aggregates of the kind
      description: |
        Without kind — module aggregates: record counts per kind,
        schema version, revisions. With kind — facet aggregates of the
        kind's parameter values: min/max of numeric parameters for
        parametric filter sliders (bounds follow search filter
        semantics: value_min/value_max and value_exact; at_least sets
        only min, at_most — only max, limits — min and/or max for the
        given bounds) and frequencies of text/enum values — the number
        of records in the kind having the value (a value in type-wide
        data and in several variants of one record counts once).
        Aggregates include type-wide data and variant data — same as
        search filters; parameters without data in the kind and ones
        not applicable to the kind (D7; including data left over
        after the catalog changed applicability) are absent from the
        response; parameters are ordered alphabetically by code (like
        /catalog), values — by descending frequency, then by text.
        A repeated recognized parameter or an unknown query key —
        400 validation_failed; unknown kind — 400 validation_failed.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: kind, in: query, schema: {type: string}, description: "Kind code: the response holds facet aggregates of the kind's parameter values (without the parameter or with an empty value — module aggregates)."}
      responses:
        "200":
          description: Module aggregates (without kind) or kind facet
            aggregates (with kind); name follows the request locale,
            unit is the canonical code.
          headers:
            Vary:
              description: Accept-Language on kind responses (the
                representation is localized); not sent on module
                aggregates without kind.
              schema: {type: string, const: Accept-Language}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Stats"
                  - $ref: "#/components/schemas/ParameterStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/changes:
    get:
      tags: [service]
      operationId: changes
      summary: Record change event feed
      description: |
        Incremental synchronization of the site's derived indexes:
        events of applied operations over records (created/updated/
        deleted, kind, designation, stable record id) in ascending
        event id order. Events are written by the same transaction
        that changes the data: the event and the change are atomic;
        a Skipped outcome leaves no event (including importer
        compensating deletions — a regular deleted).

        The cursor is the after parameter: the id of the last received
        event (after=0 — from the feed start); a revision cannot be
        a cursor: its relation to events is a write-path detail
        (several events may share one transaction, or the increment
        bypasses the feed); the id is assigned on insert and stays
        a dense monotonic cursor. The response carries the current
        data_revision (consistent with the event page). The feed
        covers only data changes (data_revision); catalog changes
        (catalog_revision) are not in the feed — for those, use the
        ETag of GET /catalog. There are no actors or before/after
        states — this is not an audit log (change history belongs to
        the site). There is no automatic retention: growth is bounded
        by editorial scale; cleanup is manual (SQL), there is no REST
        cleanup route. A repeated recognized parameter or an unknown
        query key — 400 validation_failed.
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}, description: "Cursor: the id of the last received event (0 — from the feed start)."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}, description: "Number of events per page (≤ 1000)."}
      responses:
        "200":
          description: Event page and the current data_revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangesResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components:
    get:
      tags: [components]
      operationId: components_list
      summary: Record search
      description: |
        Designation substring, system, stable-id set filter, field/
        attribute/parameter filters, sorting, pagination. The
        response is a list with designation, kind, system and key
        fields; ETag is derived from data_revision, the canonical
        query string, and the representation locale (different
        filters/sorting or locales — different ETags, RFC 9110).
        Repeating any query parameter — 400 validation_failed; the
        exceptions are deliberately repeatable id (a filter set, up
        to 200 values), dictionary filters material/subclass/
        adjustment/category (multi-select — OR semantics within a
        field) and values (value columns of result rows).

        Besides the listed parameters the following are allowed:

        * designation field filters — field code as the parameter
          name: textual `material`, `subclass`, `letters`,
          `construction`, `prefix`, `family`, `series`, `adjustment`,
          `category`, `base` (the type is the record's base
          designation, the value is canonicalized as a designation);
          numeric `junctions`, `group`, `dev_number`, `assembly`,
          `feature`, `modification`, `chip` (equality); values of
          dictionary fields `material` (`si`, `ge`, `ga`, `in`,
          `sic`, `other`, `gaas`), `subclass` (`bjt`, `zener`, …),
          `adjustment` (`fixed`, `variable`, `preset`) and `category`
          (codes of the catalog dictionary — the `dictionaries`
          section of GET /catalog) — a stable dictionary code or a
          display name in the locale (canonicalized; D9); dictionary
          fields are repeatable: each value is canonicalized
          separately, the set has OR semantics, a duplicate canonical
          code — 400 validation_failed; other textual fields are
          normative designation elements (for `other` records the
          `series` field is set by the `fields` section);
        * `attr.<code>=<value>` — attribute filter (text or number by
          the attribute type; boolean attributes are not filterable;
          a textual filter of a text_list attribute is equality to
          any element of the list);
        * `par.<code>.min=`, `par.<code>.max=`, `par.<code>.exact=` —
          bounds of a numeric parameter; `par.<code>.text=` or
          `par.<code>=<text>` — text/enum.

        Variant parametric filters apply within a single variant.
        A filter by a parameter/attribute not applicable to the
        query kind — 400 parameter_not_applicable/
        attribute_not_applicable. An unknown query parameter — 400
        validation_failed.
      parameters:
        - {name: kind, in: query, schema: {type: string}, description: "Device kind (transistor, diode, resistor, capacitor, relay)."}
        - {name: system, in: query, schema: {type: string}, description: "Designation system (gost, ost, pro, jedec, jis, other)."}
        - {name: q, in: query, schema: {type: string}, description: "Substring of a designation or of a record's historical name — synonym (case-insensitive)."}
        - name: id
          in: query
          description: |
            Filter by a set of stable record ids — a deliberately
            repeatable parameter (one of the query strictness
            exceptions — the other one, multi-select dictionary
            filters, is described above): up to 200 values, each a
            positive integer, a duplicate value — 400
            validation_failed. Semantics — intersection with other
            filters; an id without a record or one cut off by other
            filters — the row is absent from results (no dedicated
            error). Without sort, result order follows the id order
            (with sort — the requested sorting). Use case: composite
            search "site-side preselection × module parametrics"
            without duplicating the catalog.
          schema:
            type: array
            items: {type: integer, format: int64, minimum: 1}
            minItems: 1
            maxItems: 200
            uniqueItems: true
          style: form
          explode: true
        - name: values
          in: query
          description: |
            Value columns of result rows — a deliberately repeatable
            parameter: a catalog parameter code or attr.<attribute
            code>, up to 16 codes, a duplicate — 400
            validation_failed. The value is a CardValue-shaped
            element for each code present on the record (no value —
            no element), in request order: name is the request
            locale, unit is the canonical unit code, conditions —
            only on parameters. Value selection rule when a record
            has several rows (type data + variants): numeric — a
            MIN/MAX bounds aggregate (a single row keeps the exact/
            at_least/at_most/limits shape), text/enum — type data
            over variants. Boolean attributes — 400
            validation_failed; an unknown code — 400
            unknown_parameter/unknown_attribute, one not applicable
            to the query kind — 400 parameter_not_applicable/
            attribute_not_applicable (same as filters).
          schema:
            type: array
            items: {type: string, minLength: 1}
            minItems: 1
            maxItems: 16
          style: form
          explode: true
        - name: sort
          in: query
          schema: {type: string}
          description: |
            Comma-separated sort keys, "-" for descending:
            designation, id, a parse field code, or a numeric catalog
            parameter code applicable to the query kind. Text/enum
            parameters and ones not applicable to the kind — 400
            (validation_failed/parameter_not_applicable). The
            record's value for a parameter follows the direction:
            ascending — the lower bound (value_min, exact, or the
            single upper one), descending — the upper (value_max,
            exact, or the single lower one); type and variant values
            are considered (as in filters), records without a value
            go last regardless of direction. A final (kind,
            designation) ordering is appended to any sort.
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Page size (≤ 200)."}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Page offset."}
      responses:
        "200":
          description: Result page.
          headers:
            ETag:
              description: |
                Strong ETag of the form
                "data-<data_revision>-<hash>-<locale>": hash is the
                hash of the canonical query string (parameter names
                sorted, name=value pairs joined with "&"; the
                repeatable id enters once per value — order matters).
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchPage"}
        "304":
          description: Data unchanged (If-None-Match).
          headers:
            ETag:
              schema: {type: string}
            Vary:
              $ref: "#/components/headers/VaryLanguage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [components]
      operationId: components_create
      summary: Create a record
      description: |
        The body is a fill record: a designation string or a
        "name/system + sections" object. The kind is auto-detected
        from the designation; for the other system, creation is
        addressed by PUT with the kind in the path. An existing
        (kind, designation) — 409 already_exists without modifying
        the record (creation is atomic; a race of concurrent POSTs
        does not apply sections to someone else's record).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A rare race — the record was deleted between
            applying and reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/id/{id}:
    get:
      tags: [components]
      operationId: components_by_id
      summary: Card by stable id
      description: 'Designations containing "/" (MIL names) are addressed
        by this path or by search — the direct path is not guaranteed
        for them.'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/components/{kind}/{designation}:
    get:
      tags: [components]
      operationId: components_get
      summary: Record card
      description: |
        Designation + system + parsed fields, attributes, parameter
        values by groups with conditions, variant executions
        (a "rating × voltage → dimensions/mass" matrix), analogs
        (outgoing and backlinks), manufacturers. The designation in
        the path is URL-encoded.
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Record card.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [components]
      operationId: components_put
      summary: Upsert a record with section semantics
      description: |
        The body is a fill record (name/system + sections); name must
        match the path designation (otherwise 422
        designation_mismatch). The kind is set by the path (overrides
        auto-detection — the way to create other-system records).
        Outcomes: Added (created), UpdatedExisting (updated), Skipped
        (merged state matches — no database write and no revision
        increment).
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceRecord"}
      responses:
        "200":
          description: Record applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpsertResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A rare race — the record was deleted between
            applying and reading the card for the response.
          headers:
            Vary:
              $ref: "#/components/headers/VaryLanguage"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [components]
      operationId: components_delete
      summary: Delete a record (cascade)
      parameters:
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/Designation"}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "204":
          description: Record deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/suggest:
    get:
      tags: [service]
      operationId: suggest
      summary: Designation prefix autocomplete
      description: 'Disabled by module configuration — the handler is not
        mounted (404 when disabled). A repeated recognized parameter
        or an unknown query key — 400 validation_failed (typos do not
        pass silently).'
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}, description: "Prefix of a designation or of a record's historical name — synonym."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind."}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SuggestResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/parse:
    get:
      tags: [service]
      operationId: parse
      summary: Parse a designation
      description: |
        Parses a designation with the same strict grammars as CLI
        parse: without system — auto-detection (fixed order:
        semiconductor gost → pro → jedec → jis → resistor gost/ost →
        capacitor gost); with system — parsing in the explicit system
        (for other the kind is required, otherwise 400
        kind_ambiguous). The designation is canonicalized (case,
        whitespace, and typographic hyphens do not matter); system/
        kind override auto-detection, a contradiction — 400
        designation_mismatch. The response is kind, system, canonical
        designation, parsed fields and candidates: all successful
        strict parses in auto-detection order without kind/system
        pair duplicates (the first candidate under auto-detection
        equals the main result). Strict grammars have no numeric
        "confidence" — the candidate list is the equivalent. A
        repeated recognized query parameter or an unknown query key —
        400 validation_failed (typos do not pass silently).
      parameters:
        - {name: designation, in: query, required: true, schema: {type: string}, description: "Designation (canonicalized)."}
        - {name: system, in: query, schema: {type: string, enum: [gost, ost, pro, jedec, jis, other]}, description: "Designation system; without the parameter — auto-detection."}
        - {name: kind, in: query, schema: {type: string}, description: "Device kind (overrides auto-detection; required for system=other)."}
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Designation parse with strict-system candidates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParseResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/import:
    post:
      tags: [import]
      operationId: import
      summary: Fill file import (NDJSON, jsonc, yaml)
      description: |
        The body is a fill file; the format is set by the mandatory
        Content-Type header: application/x-ndjson — an NDJSON stream
        (one JSON line per entity: wrapper lines `{"<kind>":
        <record>}`, the catalog block — sub-section lines up to the
        records; plan 04 §4) is read streaming, without loading the
        whole body and without a request size cap — memory is bounded
        by the single-line cap (16 MiB); application/json (jsonc,
        comments allowed) and application/yaml — the document is read
        whole with a 16 MiB body cap (exceeding — 400
        invalid_import_file; for larger volumes use NDJSON). A
        missing or unsupported Content-Type — 400 validation_failed;
        Content-Type parameters (charset) are allowed and ignored.
        The response is a synchronous report after EOF: outcome
        counters and the full list of run issues (Issues model:
        valid records are applied, invalid ones are not, a record is
        not applied at all); 200 is returned for runs with issues
        too. A hard failure is only format syntax and stream reading
        (400 invalid_import_file). The only query parameter is
        dry_run=true: a trial run of the same validation pipeline
        without writing to the database (the report is marked
        dry_run); the value is strictly true or false (anything else
        and a repeated parameter — 400 validation_failed), other
        keys — 400. Progress is not streamed over REST — the request
        is synchronous (run observation is the site's metrics hook);
        writing is mounted by the site only on protected routes.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - {name: dry_run, in: query, schema: {type: boolean, enum: [true, false], default: false}, description: "Trial run without writing to the database (the value is strictly true or false)."}
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: An NDJSON stream — one JSON line per
                entity; no request size cap.
          application/json:
            schema:
              type: string
              description: A jsonc document (// comments allowed);
                the body is read whole, cap 16 MiB.
          application/yaml:
            schema:
              type: string
              description: A yaml document; the body is read whole,
                cap 16 MiB.
      responses:
        "200":
          description: Import run report (issue messages follow the
            request locale).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportReport"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  headers:
    VaryLanguage:
      description: Always Accept-Language — the response representation
        is selected by the request locale (D9); a cache must
        distinguish representations of different locales
        (RFC 9110/9111).
      schema: {type: string, const: Accept-Language}
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      description: Device kind code.
      schema: {type: string}
    Designation:
      name: designation
      in: path
      required: true
      description: URL-encoded designation.
      schema: {type: string}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: "Locale of the response display strings (D9): q-values, basic subtag; en and ru are supported; default en."
      schema: {type: string, examples: ["ru", "en-US,en;q=0.8"]}
  responses:
    BadRequest:
      description: Bad request (parameters/path/body syntax).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Not found.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflict (the record already exists).
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: Method not supported for the path (the Allow header
        lists the allowed methods).
      headers:
        Allow:
          description: Comma-separated list of the methods allowed for
            the path.
          schema: {type: string}
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: Semantic error of the record/designation.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Internal error.
      headers:
        Vary:
          $ref: "#/components/headers/VaryLanguage"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code (Latin snake_case).
          examples: [validation_failed]
        message:
          type: string
          description: Message text in the request locale
            (Accept-Language; en is canonical).
    KindDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KindsResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
    Field:
      type: object
      required: [name]
      properties:
        name: {type: string}
        text: {type: string}
        num: {type: number}
    FieldValueDef:
      type: object
      description: A designation dictionary field value — a stable code
        (the value of filters and of the fields section) and a
        display name in the request locale (D9).
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    FieldDictionaries:
      type: object
      description: |
        Value dictionaries of designation dictionary fields — the
        contents of multi-select filters: material/subclass/
        adjustment are constant domain registries, category is a
        catalog data dictionary (extended by import; extensions
        without a bundle entry are displayed by code). Value order
        is stable (domain registries and snapshot rows).
      required: [material, subclass, adjustment, category]
      properties:
        material:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        subclass:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        adjustment:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
        category:
          type: array
          items: {$ref: "#/components/schemas/FieldValueDef"}
    Condition:
      type: object
      required: [condition, value]
      properties:
        condition: {type: string, description: Measurement condition code.}
        value: {type: number}
    CardAttribute:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        text: {type: string}
        texts:
          type: array
          description: Note list of a text_list attribute (order follows
            the fill order); omitted on scalar attributes.
          items: {type: string}
        num: {type: number}
        bool: {type: boolean}
    CardValue:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardGroup:
      type: object
      required: [code, section, name, values]
      properties:
        code: {type: string}
        section: {type: string, description: Fill file section name.}
        name: {type: string}
        values:
          type: array
          description: Values in the catalog's canonical order (the
            parameter's sort_order); same-named rows of one parameter
            follow the fill order.
          items: {$ref: "#/components/schemas/CardValue"}
    CardVariant:
      type: object
      required: [label, attributes, groups]
      properties:
        label: {type: string}
        attributes:
          type: array
          description: Variant attributes — construction traits.
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
    CardTypeSibling:
      type: object
      required: [id, system, designation]
      properties:
        id: {type: integer, format: int64}
        system: {type: string}
        designation: {type: string}
    CardTypeValue:
      type: object
      required: [designation]
      properties:
        designation: {type: string, description: Designation of a type-group record.}
        exact: {type: number}
        min: {type: number}
        max: {type: number}
        text: {type: string}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/Condition"}
    CardTypeDiff:
      type: object
      required: [parameter, name, values]
      properties:
        parameter: {type: string}
        name: {type: string}
        unit: {type: string, description: Canonical unit code.}
        values:
          type: array
          description: Values per type-group record (a record without a
            parameter value has no cell).
          items: {$ref: "#/components/schemas/CardTypeValue"}
    CardTypeGroup:
      type: object
      required: [base, siblings, diffs]
      properties:
        base: {type: string, description: Base designation (the type) — the designation without the classification letter and trailing elements.}
        siblings:
          type: array
          description: Sibling records of the same kind with the same
            type.
          items: {$ref: "#/components/schemas/CardTypeSibling"}
        diffs:
          type: array
          description: Mini-matrix of differences — parameters whose
            values differ across the group records (type-wide data).
          items: {$ref: "#/components/schemas/CardTypeDiff"}
    CardLink:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        note: {type: string}
    CardSynonym:
      type: object
      required: [designation]
      description: |
        A record's historical name (synonym): the designation under
        which the component was produced in other years (С5-35 = ПЭВ);
        the note is the name's origin, the years are its usage period.
      properties:
        designation: {type: string}
        note: {type: string}
        year_from: {type: integer}
        year_to: {type: integer}
    CardSource:
      description: A record data source (plan 03 §13) — a book,
        reference, datasheet, standard, specification, article, or a
        web page; bibliographic texts are non-localizable data,
        type_name is the localized display name of the type
        (sourcetype.<code>).
      type: object
      required: [code, title, type, type_name, authors, editors, urls]
      properties:
        code: {type: string}
        title: {type: string}
        type: {type: string}
        type_name: {type: string}
        authors:
          description: Authors, order matters.
          type: array
          items: {type: string}
        editors:
          description: Editors/compilers, order matters.
          type: array
          items: {type: string}
        year: {type: integer}
        publisher: {type: string}
        edition: {type: string}
        isbn: {type: string}
        urls:
          description: Documentation links (original, mirrors, archived
            copies; the first element is preferred).
          type: array
          items: {type: string}
        note:
          description: 'Location in the source ("table 5.3", "p. 214").'
          type: string
    Card:
      type: object
      required: [id, kind, kind_name, system, system_name, designation, fields, attributes, groups, variants, manufacturers, analogs, backlinks, synonyms, sources]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        kind_name: {type: string}
        system: {type: string}
        system_name: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/CardAttribute"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/CardGroup"}
        variants:
          type: array
          items: {$ref: "#/components/schemas/CardVariant"}
        type_group:
          description: Type group (omitted when there are no sibling
            records with the same base designation).
          allOf: [{$ref: "#/components/schemas/CardTypeGroup"}]
        manufacturers:
          type: array
          items: {type: string}
        analogs:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        backlinks:
          type: array
          items: {$ref: "#/components/schemas/CardLink"}
        synonyms:
          type: array
          items: {$ref: "#/components/schemas/CardSynonym"}
        sources:
          description: Record data sources (plan 03 §13) — the full
            bibliographic definition and the location note in the
            source; canonical order, by code.
          type: array
          items: {$ref: "#/components/schemas/CardSource"}
    Outcome:
      type: string
      enum: [Added, UpdatedExisting, Skipped]
    UpsertResponse:
      type: object
      required: [outcome, card]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        card: {$ref: "#/components/schemas/Card"}
    SearchItem:
      type: object
      required: [id, kind, system, designation, fields]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        values:
          type: array
          description: Values of the requested columns (the values
            parameter) in request order; a CardValue-shaped element
            per code present on the record (no value — no element).
          items: {$ref: "#/components/schemas/CardValue"}
    SearchPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SearchItem"}
        total: {type: integer, description: Total number of records under the filters.}
        limit: {type: integer}
        offset: {type: integer}
    Suggestion:
      type: object
      required: [kind, system, designation]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string}
    SuggestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Suggestion"}
    ParseCandidate:
      type: object
      required: [kind, system]
      description: A strict system that accepted the designation.
      properties:
        kind: {type: string}
        system: {type: string}
    ParseResponse:
      type: object
      required: [kind, system, designation, fields, candidates]
      properties:
        kind: {type: string}
        system: {type: string}
        designation: {type: string, description: Canonical designation.}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
        candidates:
          type: array
          description: |
            All successful strict parses in the fixed auto-detection
            order without kind/system pair duplicates; under
            auto-detection the first element equals the main result.
            Strict grammars have no numeric "confidence" — the
            candidate list is the equivalent. Empty for records
            outside strict grammars (explicit other system).
          items: {$ref: "#/components/schemas/ParseCandidate"}
    Stats:
      type: object
      required: [schema_version, catalog_revision, data_revision, total, kinds]
      properties:
        schema_version: {type: integer}
        catalog_revision: {type: integer, format: int64}
        data_revision: {type: integer, format: int64}
        total: {type: integer}
        kinds:
          type: object
          additionalProperties: {type: integer}
          description: Record counts by kind codes.
    ParameterStats:
      type: object
      description: Facet aggregates of a kind's parameter values.
      required: [kind, data_revision, parameters]
      properties:
        kind: {type: string}
        data_revision: {type: integer, format: int64, description: "Data revision consistent with the aggregates."}
        parameters:
          type: array
          description: The kind's parameters with data alphabetically
            by code; numeric ones — min/max, text/enum — value
            frequencies.
          items: {$ref: "#/components/schemas/ParameterStat"}
    ParameterStat:
      type: object
      required: [parameter, name]
      properties:
        parameter: {type: string}
        name: {type: string, description: Display name in the request locale.}
        unit: {type: string, description: Canonical unit code.}
        min: {type: number, description: "Lower bound of the parameter's values in the kind (omitted when absent)."}
        max: {type: number, description: "Upper bound of the parameter's values in the kind (omitted when absent)."}
        values:
          type: array
          description: Frequencies of text/enum values (numeric
            parameters yield none); by descending frequency, then by
            text.
          items: {$ref: "#/components/schemas/ParameterValueFreq"}
    ParameterValueFreq:
      type: object
      required: [text, count]
      properties:
        text: {type: string}
        count: {type: integer, description: Number of records in the kind having the value.}
    ChangeEvent:
      type: object
      description: An event of an applied operation over a device record.
      required: [id, revision, op, kind, designation, device_id]
      properties:
        id: {type: integer, format: int64, description: "Monotonic event id — the consumer's cursor."}
        revision: {type: integer, format: int64, description: The event transaction's data_revision (after the increment).}
        op: {type: string, enum: [created, updated, deleted]}
        kind: {type: string, description: Record kind code.}
        designation: {type: string, description: Canonical designation.}
        device_id: {type: integer, format: int64, description: Stable record id.}
    ChangesResponse:
      type: object
      required: [events, data_revision]
      properties:
        events:
          type: array
          description: Events in ascending id order (may be empty).
          items: {$ref: "#/components/schemas/ChangeEvent"}
        data_revision: {type: integer, format: int64, description: "Current data revision (consistent with the page)."}
    ImportIssue:
      type: object
      description: An import run issue (position — when defined).
      required: [code, message]
      properties:
        record: {type: string, description: "Record designation (omitted for root-level issues)."}
        line: {type: integer, description: NDJSON line number (omitted when undefined).}
        no: {type: integer, description: Ordinal number of the record in the document section (omitted when not set).}
        code: {type: string, description: Machine-readable issue code.}
        message: {type: string, description: Message text in the request locale.}
    ImportReport:
      type: object
      description: Synchronous report of the POST /api/v1/import run.
      required: [dry_run, records, added, updated, skipped, rejected, catalog_applied, sources_applied, issues]
      properties:
        dry_run: {type: boolean, description: Trial run without writing to the database.}
        records: {type: integer, description: "Records in the body (including rejected)."}
        added: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: The merged state matches the current one — no database write and no revision increment.}
        rejected: {type: integer, description: "Records not applied due to issues."}
        catalog_applied: {type: boolean, description: "The catalog section was applied with an actual change (re-importing an identical catalog — false, catalog_revision is not incremented)."}
        sources_applied: {type: boolean, description: "The source registry was changed by the root sources section (data_revision increments without change_events; a re-import without changes — false)."}
        issues:
          type: array
          description: The full list of run issues (may be empty).
          items: {$ref: "#/components/schemas/ImportIssue"}
    DeviceRecord:
      description: |
        A fill record: a designation string or a "name/system +
        sections" object. Group sections are flat lists of {parameter,
        value, conditions} objects; conditions are adjacent keys by
        codes. Absent/null — leave unchanged, present — replace
        entirely, []/{} — clear.
      oneOf:
        - type: string
        - type: object
          required: [name]
          properties:
            name: {type: string, description: Designation.}
            system: {type: string, description: "Designation system; required for other."}
            fields:
              type: object
              description: |
                Explicit classification fields (D10): a "field code →
                dictionary value" object (`assembly` is the number
                0/1). Sets only fields that the record's
                designation-system parser does not set itself, and
                only ones applicable to the kind
                (docs/fill-format.md §5.1); replaced entirely.
              additionalProperties: {oneOf: [{type: string}, {type: number}]}
            attributes:
              type: object
              description: "Attribute code → value (string / string array
                for text_list attributes / number / boolean; null —
                the attribute is not set)."
            manufacturers:
              type: array
              items: {type: string}
            variants:
              type: array
              items: {$ref: "#/components/schemas/DeviceVariant"}
            analogs:
              type: array
              description: |
                Outgoing directed analog links (plan 03 §8, D8):
                designations of the same kind or objects with a
                replacement-nature note. Section semantics are common
                (replace entirely); the designation is canonicalized
                and must exist in the same kind, otherwise — 422
                unknown_analog.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
            synonyms:
              type: array
              description: |
                The record's historical names (D11): a synonym
                designation is not a record — find and search (q=)
                resolve it to the owning record. Unique within a kind;
                creating a record with a designation occupied by
                another record's synonym is a conflict (409). Years
                are integers 1949–2100, yearFrom precedes yearTo.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      note: {type: string}
                      yearFrom: {type: integer}
                      yearTo: {type: integer}
            sources:
              type: array
              description: |
                References to the record's data sources (plan 03
                §13, D13): registry code strings or objects with a
                code and a location note in the source. Section
                semantics are common (replaced entirely); the code
                must exist in the registry (definitions are set by the
                root sources section of the import file), otherwise —
                422 unknown_source.
              items:
                oneOf:
                  - type: string
                  - type: object
                    required: [code]
                    properties:
                      code: {type: string}
                      note: {type: string}
    DeviceVariant:
      type: object
      properties:
        label: {type: string}
        attributes:
          type: object
          description: "Attribute code → variant value (construction
            traits differing across variants — docs/fill-format.md
            §6): string / string array for text_list attributes /
            number / boolean; the value shape is as in record
            attributes, null — the attribute is not set; replaced
            together with the variants set."
    UnitDef:
      type: object
      required: [code, name, symbol]
      properties:
        code: {type: string}
        name: {type: string}
        symbol: {type: string}
    ConditionDef:
      type: object
      required: [code, name, allow_negative]
      properties:
        code: {type: string}
        name: {type: string}
        unit: {type: string}
        allow_negative: {type: boolean}
    GroupDef:
      type: object
      required: [code, section, name, sort_order]
      properties:
        code: {type: string}
        section: {type: string}
        name: {type: string}
        sort_order: {type: integer}
    ConditionSetItem:
      type: object
      required: [condition, mode]
      properties:
        condition: {type: string}
        mode: {type: string, enum: [required, optional]}
        fixed_value: {type: number}
    ConditionSet:
      type: object
      required: [no, items]
      properties:
        no: {type: integer}
        items:
          type: array
          items: {$ref: "#/components/schemas/ConditionSetItem"}
    ParameterDef:
      type: object
      required: [code, group, name, value_type, allow_negative, sort_order, is_active, kinds, enum_values, condition_sets]
      properties:
        code: {type: string}
        group: {type: string}
        name: {type: string}
        unit: {type: string}
        value_type: {type: string, enum: [exact, at_least, at_most, range, limits, text, enum]}
        ceiling: {type: number}
        allow_negative: {type: boolean}
        validation_rule: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
          description: Empty — applicable to all kinds.
        enum_values:
          type: array
          items: {type: string}
        condition_sets:
          type: array
          items: {$ref: "#/components/schemas/ConditionSet"}
    AttributeDef:
      type: object
      required: [code, name, type, sort_order, is_active, kinds, enum_values]
      properties:
        code: {type: string}
        name: {type: string}
        group: {type: string}
        type: {type: string, enum: [text, text_list, bool, int, number, enum]}
        unit: {type: string}
        validation_rule: {type: string}
        sort_order: {type: integer}
        is_active: {type: boolean}
        kinds:
          type: array
          items: {type: string}
        enum_values:
          type: array
          items: {type: string}
    SystemDef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
    SystemKindRef:
      type: object
      required: [system, kind]
      properties:
        system: {type: string}
        kind: {type: string}
    RuleDef:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    KindRuleRef:
      type: object
      required: [kind, rule]
      properties:
        kind: {type: string}
        rule: {type: string}
    CatalogSnapshot:
      type: object
      required: [revision, kinds, systems, system_kinds, units, conditions, groups, parameters, attributes, rules, kind_rules, dictionaries]
      properties:
        revision: {type: integer, format: int64, description: catalog_revision.}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/KindDef"}
        systems:
          type: array
          items: {$ref: "#/components/schemas/SystemDef"}
        system_kinds:
          type: array
          items: {$ref: "#/components/schemas/SystemKindRef"}
        units:
          type: array
          items: {$ref: "#/components/schemas/UnitDef"}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/ConditionDef"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupDef"}
        parameters:
          type: array
          items: {$ref: "#/components/schemas/ParameterDef"}
        attributes:
          type: array
          items: {$ref: "#/components/schemas/AttributeDef"}
        rules:
          type: array
          items: {$ref: "#/components/schemas/RuleDef"}
        kind_rules:
          type: array
          items: {$ref: "#/components/schemas/KindRuleRef"}
        dictionaries:
          $ref: "#/components/schemas/FieldDictionaries"
