# Полный QA-контур GitHub-зеркала: кроссплатформенный прогонщик
# `go run ./qa/runner` (сборка, статика, пример встраивания, сценарии
# CLI/REST, нагрузочная прикидка 10⁴) на трёх ногах:
#   - linux + SQLite (CATALOG_QA_DIALECT=sqlite);
#   - linux + PostgreSQL 16 (служба с healthcheck,
#     CATALOG_QA_DIALECT=postgres);
#   - windows + SQLite: CLI собирается и под Windows, поэтому сценарии
#     прогоняются на windows-latest (в GitLab-инсталляции этой ноги нет —
#     там Windows-раннера нет, см. .gitlab-ci.yml).
#
# На каждый пуш контур не выполняется. Запускается двумя способами:
#   - workflow_dispatch — вручную: из UI Actions по ветке или тегу,
#     произвольный коммит — через API (gh workflow run qa.yml --ref <SHA>);
#   - workflow_call — из release.yml: тот же контур служит строгим
#     QA-гейтом сборки релиза на том же коммите тега.
#
# Отчёт текущего прогона (свежее qa/reports/*.log по маркеру времени)
# выгружается артефактом и при отказе тоже.

name: QA

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qa-linux-sqlite:
    name: QA (linux, SQLite, load x10000)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: QA report marker
        run: touch "$RUNNER_TEMP/qa-report.marker"
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Collect current QA report
        if: always()
        run: |
          mkdir -p qa-artifact
          find qa/reports -maxdepth 1 -name '*.log' -newer "$RUNNER_TEMP/qa-report.marker" -exec cp -t qa-artifact/ {} +
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: qa-report-linux-sqlite
          path: qa-artifact/*.log

  qa-linux-postgres:
    name: QA (linux, PostgreSQL, load x10000)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/catalog_test
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: QA report marker
        run: touch "$RUNNER_TEMP/qa-report.marker"
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Collect current QA report
        if: always()
        run: |
          mkdir -p qa-artifact
          find qa/reports -maxdepth 1 -name '*.log' -newer "$RUNNER_TEMP/qa-report.marker" -exec cp -t qa-artifact/ {} +
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: qa-report-linux-postgres
          path: qa-artifact/*.log

  qa-windows-sqlite:
    name: QA (windows, SQLite, load x10000)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: QA report marker
        run: New-Item -Path "$env:RUNNER_TEMP/qa-report.marker" -ItemType File | Out-Null
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Collect current QA report
        if: always()
        run: |
          New-Item -ItemType Directory -Force qa-artifact | Out-Null
          $marker = Get-Item "$env:RUNNER_TEMP/qa-report.marker"
          Get-ChildItem qa/reports -Filter *.log |
            Where-Object { $_.LastWriteTime -gt $marker.LastWriteTime } |
            Copy-Item -Destination qa-artifact
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: qa-report-windows
          path: qa-artifact/*.log
