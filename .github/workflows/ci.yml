name: CI

on:
  - push
  - pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Файлы требуют gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...
