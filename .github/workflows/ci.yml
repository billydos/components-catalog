# Дешёвые проверки пул-реквестов GitHub-зеркала: gofmt/vet (lint) и
# go test (test). Полный QA-контур на каждый пуш не выполняется:
# он запускается вручную (qa.yml, workflow_dispatch) и гейтит релиз
# (release.yml, workflow_call). До включения зеркалирования QA на каждый
# пуш идёт в GitLab (.gitlab-ci.yml) — этот воркфлоу закрывает только
# сторону GitHub.
#
# gofmt считается по файлам репозитория (git ls-files), а не обходом
# дерева: внутри дерева может лежать кэш модулей, и `gofmt -l .`
# уходил бы разбирать чужие testdata.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (gofmt, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: |
          fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$fmt" ]; then
            echo "gofmt требует правки в файлах:"
            echo "$fmt"
            exit 1
          fi
          echo "gofmt: чисто"
      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
