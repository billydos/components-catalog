name: CI

on:
  - push
  - pull_request

jobs:
  qa-linux-sqlite:
    name: QA (linux, SQLite, load x10000)
    runs-on: ubuntu-latest
    env:
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-linux-sqlite
          path: qa/reports/*.log

  qa-linux-postgres:
    name: QA (linux, PostgreSQL, load x10000)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/catalog_test
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-linux-postgres
          path: qa/reports/*.log

  qa-windows:
    name: QA (windows, SQLite, load x10000)
    runs-on: windows-latest
    env:
      CATALOG_QA_SCALE: "10000"
      CATALOG_QA_DIALECT: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: QA (build, vet, gofmt, test, scenarios, load)
        run: go run ./qa/runner
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-windows
          path: qa/reports/*.log
