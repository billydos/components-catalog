# Релиз GitHub-зеркала — по тегу vX.Y.Z (маска `v[0-9]*.[0-9]*.[0-9]*`
# покрывает и prerelease-теги вида v1.2.3-rc.1; прочие теги пайплайна
# не создают).
#
# Цепочка: verify (тег указывает на коммит в истории main; build, vet,
# gofmt, test) → qa — полный QA-контур qa.yml на том же коммите тега
# (linux/sqlite, linux/postgres, windows): отказ QA останавливает релиз →
# build — кросс-сборка catalogctl для 6 целей (CGO_ENABLED=0, архивы
# tar.gz/zip) → publish — контрольные суммы и GitHub Release.
#
# Заметки релиза — раздел CHANGELOG.md с заголовком «## <тег>».
# Отсутствие раздела (или пустой раздел) — ошибка, релиз останавливается:
# забытый раздел — ошибка процесса, а не повод публиковать autogenerated
# заметки. Prerelease-тег (дефис в суффиксе) публикуется с пометкой
# --prerelease.
#
# Идемпотентность повторного запуска: существующий релиз не дублируется —
# заметки обновляются (gh release edit), ассеты перезаливаются (--clobber).

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tag on main, build, vet, gofmt, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and vet
        run: go build ./... && go vet ./...
      - name: Gofmt
        run: |
          fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$fmt" ]; then
            echo "gofmt требует правки в файлах:"
            echo "$fmt"
            exit 1
          fi
          echo "gofmt: чисто"
      - name: Test
        run: go test ./...

  qa:
    name: QA (linux/sqlite, linux/postgres, windows)
    needs: [verify]
    # полный контур qa.yml на том же коммите: отказ любой ноги
    # останавливает build и publish
    uses: ./.github/workflows/qa.yml

  build:
    name: Build catalogctl (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [qa]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          bin=catalogctl
          if [ "$GOOS" = windows ]; then bin=catalogctl.exe; fi
          go build -trimpath -ldflags "-s -w -X github.com/billydos/components-catalog/internal/cli.Version=${GITHUB_REF_NAME}" -o "dist/$bin" ./cmd/catalogctl
      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: tar -czf "dist/catalogctl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C dist catalogctl
      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip -q "catalogctl-${{ matrix.goos }}-${{ matrix.goarch }}.zip" catalogctl.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: catalogctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/catalogctl-*

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: catalogctl-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum catalogctl-* > checksums.txt
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            $0 == "## " tag { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "ошибка: в CHANGELOG.md нет раздела '## ${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/checksums.txt \
            dist/catalogctl-*.tar.gz \
            dist/catalogctl-*.zip \
            --clobber
