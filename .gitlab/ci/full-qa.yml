# Полный QA-контур — дочерний пайплайн, запускается кнопкой full-qa
# из корневого .gitlab-ci.yml (trigger + strategy: depend). Повторяет
# короткий контур корневого пайплайна (lint, test, прогонщик на SQLite
# и PostgreSQL) и добавляет crossbuild, govulncheck (vuln) и нагрузочную
# прикидку 10⁴.
#
# Переменные корневого пайплайна наследуются триггером, а stages и
# default (образ, раннер, кэш) в дочерний конфиг не попадают — блоки
# дублируются явно.

stages:
  - lint
  - test
  - vuln
  - qa

variables:
  GOFLAGS: "-mod=readonly"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/build"

default:
  # Debian-вариант образа: нужны bash (/dev/tcp в ожидании службы), git, apt
  image: golang:1.26
  tags:
    - docker
  interruptible: true
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .go/bin/
      - .go/build/

lint:
  stage: lint
  script:
    - |
      fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
      if [ -n "$fmt" ]; then
        echo "gofmt требует правки в файлах:"
        echo "$fmt"
        exit 1
      fi
      echo "gofmt: чисто"
    - go vet ./...

test:
  stage: test
  script:
    - go test ./...

crossbuild:
  stage: test
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64; do
        goos="${target%/*}"
        goarch="${target#*/}"
        echo "сборка GOOS=${goos} GOARCH=${goarch}"
        GOOS="$goos" GOARCH="$goarch" go build ./... || exit 1
      done

vuln:
  stage: vuln
  script:
    # версия не пиннится: govulncheck должен понимать текущую версию Go
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - export PATH="$(go env GOPATH)/bin:$PATH" && govulncheck ./...

# Прогонщик — как в корневом пайплайне, но с нагрузочной прикидкой 10⁴;
# отчёт выгружается артефактом и при отказе тоже.
.qa-run:
  stage: qa
  timeout: 60m
  script:
    - |
      set +e
      go run ./qa/runner -report qa-artifact/qa-report.log
      rc=$?
      set -e
      if [ -f qa-artifact/qa-report.log ]; then
        echo "отчёт прогона: qa-artifact/qa-report.log"
      else
        echo "предупреждение: отчёт qa-artifact/qa-report.log не создан"
      fi
      exit "$rc"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa-artifact/

qa-sqlite:
  extends: .qa-run
  variables:
    CATALOG_QA_SCALE: "10000"
    CATALOG_QA_DIALECT: sqlite

qa-postgres:
  extends: .qa-run
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: catalog_test
    CATALOG_TEST_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/catalog_test"
    CATALOG_QA_SCALE: "10000"
    CATALOG_QA_DIALECT: postgres
  before_script:
    # служба стартует асинхронно: ждём открытия порта, а не только
    # контейнера. exit здесь запрещён: before_script и script крутятся
    # в одной оболочке — exit 0 завершал джобу «успехом» ещё до
    # запуска QA (отчёта нет, артефакт пуст, script молчит)
    - |
      echo "ожидание PostgreSQL…"
      ready=0
      for i in $(seq 1 60); do
        if (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; then
          echo "PostgreSQL готов (попытка $i)"
          ready=1
          break
        fi
        sleep 1
      done
      if [ "$ready" -ne 1 ]; then
        echo "PostgreSQL не поднялся за 60 с"
      fi
      [ "$ready" -eq 1 ]
