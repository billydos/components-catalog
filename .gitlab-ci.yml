# GitLab CI/CD для components-catalog — три контура.
#
# 1. Автоматически (каждый пуш ветки и MR) — короткое QA: lint (gofmt,
#    vet), test (go test) и QA-прогонщик `go run ./qa/runner` без
#    нагрузочной прикидки (CATALOG_QA_SCALE=0 — фаза load опускается)
#    на SQLite и PostgreSQL 16.
# 2. Вручную — полный QA: кнопка full-qa запускает дочерний пайплайн
#    .gitlab/ci/full-qa.yml — короткий контур плюс crossbuild,
#    govulncheck и нагрузочная прикидка 10⁴.
# 3. Вручную — зеркало на GitHub: кнопка github-mirror в пайплайнах
#    основной ветки пушит ветку и теги в github.com/billydos/
#    components-catalog.
#
# Теги пайплайнов не создают. Релизы — только на GitHub:
# .github/workflows/release.yml (verify → полный QA → кросс-сборка →
# GitHub Release с заметками из CHANGELOG.md), теги попадают туда
# зеркалом.
#
# Переменные QA — те же, что в GitHub-воркфлоу `.github/workflows/`
# (CATALOG_QA_SCALE, CATALOG_QA_DIALECT, CATALOG_TEST_POSTGRES_DSN).
#
# Требования к раннеру: docker-исполнитель с тегом `docker` (тег задан в
# `default`, поэтому джобы не зависят от настройки «Run untagged jobs»),
# а инстанс-раннеры должны быть включены для проекта
# (Settings → CI/CD → Runners → «Turn on instance runners for this project»).

workflow:
  rules:
    # каждая ветка и каждый MR получают ровно один пайплайн:
    # при открытом MR ветку покрывает пайплайн MR; теги пайплайнов
    # не создают
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - when: never

stages:
  - lint
  - test
  - qa
  - mirror

variables:
  GOFLAGS: "-mod=readonly"
  # Go-кэш — внутри каталога проекта: GitLab кэширует только пути внутри
  # $CI_PROJECT_DIR. На проверки это не влияет: gofmt считается по файлам
  # репозитория (стадия static прогонщика и джоба lint), а `.go/` внесён
  # в .gitignore — в список файлов кэш не попадает.

  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/build"

default:
  # Debian-вариант образа: нужны bash (/dev/tcp в ожидании службы), git, apt
  image: golang:1.26
  # Инстанс-раннер не берёт джобы без тегов (Run untagged jobs выключен),
  # поэтому тег задаётся явно: docker-исполнителем с этим тегом.
  tags:
    - docker
  interruptible: true
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .go/bin/
      - .go/build/

# --- 1. Короткое QA (автоматически) ----------------------------------------

lint:
  stage: lint
  script:
    - |
      fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
      if [ -n "$fmt" ]; then
        echo "gofmt требует правки в файлах:"
        echo "$fmt"
        exit 1
      fi
      echo "gofmt: чисто"
    - go vet ./...

test:
  stage: test
  script:
    - go test ./...

# Общий контур QA-прогонщика: отчёт текущего прогона выгружается артефактом
# и при отказе тоже. Путь отчёта задаётся явно (-report) — в артефакт
# попадает только он, закоммиченные исторические отчёты не участвуют.
.qa-run:
  stage: qa
  timeout: 60m
  script:
    - |
      set +e
      go run ./qa/runner -report qa-artifact/qa-report.log
      rc=$?
      set -e
      if [ -f qa-artifact/qa-report.log ]; then
        echo "отчёт прогона: qa-artifact/qa-report.log"
      else
        echo "предупреждение: отчёт qa-artifact/qa-report.log не создан"
      fi
      exit "$rc"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa-artifact/

qa-sqlite:
  extends: .qa-run
  variables:
    # короткий контур: фаза load опускается, статика/пример/сценарии — те же
    CATALOG_QA_SCALE: "0"
    CATALOG_QA_DIALECT: sqlite

qa-postgres:
  extends: .qa-run
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: catalog_test
    CATALOG_TEST_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/catalog_test"
    CATALOG_QA_SCALE: "0"
    CATALOG_QA_DIALECT: postgres
  before_script:
    # служба стартует асинхронно: ждём открытия порта, а не только контейнера
    - |
      echo "ожидание PostgreSQL…"
      for i in $(seq 1 60); do
        if (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; then
          echo "PostgreSQL готов (попытка $i)"
          exit 0
        fi
        sleep 1
      done
      echo "PostgreSQL не поднялся за 60 с"
      exit 1

# --- 2. Полный QA (вручную, дочерний пайплайн) ------------------------------

full-qa:
  stage: qa
  # needs: [] — кнопка доступна сразу, не дожидаясь коротких джоб;
  # strategy: depend — статус дочернего пайплайна виден в корневом
  # allow_failure: true обязателен: у manual-триггеров (bridge-джоб)
  # allow_failure по умолчанию false — без него пайплайн, оставшись
  # с ненажатой кнопкой, висит в состоянии blocked
  when: manual
  needs: []
  allow_failure: true
  trigger:
    include: .gitlab/ci/full-qa.yml
    strategy: depend

# --- 3. Зеркало на GitHub (вручную) -----------------------------------------

# Ручной пуш основной ветки и тегов в зеркало github.com/billydos/
# components-catalog. Джоба существует только в пайплайнах основной
# ветки и запускается кнопкой (manual + allow_failure: true —
# пайплайн не блокирует: у manual-джоб в rules allow_failure по
# умолчанию false, и без явного true пайплайн висел бы в blocked).
# Сначала пушится ветка, затем теги:
# релизный воркфлоу GitHub (release.yml) срабатывает по тегу vX.Y.Z и
# его verify требует тег в истории origin/main — ветка должна оказаться
# в зеркале раньше тегов.
#
# Токен — CI/CD-переменная GITHUB_MIRROR_TOKEN (masked + protected,
# fine-grained PAT с Contents: write на зеркало); основная ветка обязана
# быть protected, иначе protected-переменная в джобу не попадёт.
#
# Ветка пушится с зеркальной семантикой --force-with-lease (lease —
# фактическое состояние зеркала из ls-remote): зеркало обязано точно
# повторять GitLab, история в нём могла разойтись после ребейза в
# источнике; lease защищает от гонки, но не от перезаписи. Теги —
# обычным push: новые уходят, идентичные игнорируются, а расхождение
# существующего тега — громкий отказ, а не перезапись.
github-mirror:
  stage: mirror
  interruptible: false
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    GIT_DEPTH: "0"
  # кэш Go не нужен — работает только git
  cache: []
  script:
    - |
      url="https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/billydos/components-catalog.git"
      git fetch --tags origin
      remote_main="$(git ls-remote "$url" refs/heads/main | cut -f1)"
      if [ -n "$remote_main" ]; then
        git push --force-with-lease="refs/heads/main:${remote_main}" \
          "$url" "$CI_COMMIT_SHA:refs/heads/${CI_DEFAULT_BRANCH}"
      else
        git push "$url" "$CI_COMMIT_SHA:refs/heads/${CI_DEFAULT_BRANCH}"
      fi
      git push "$url" --tags
