# GitLab CI/CD для components-catalog.
#
# QA — на каждый пуш, merge request и тег: gofmt/vet (lint), go test (test),
# кроссплатформенная сборка (crossbuild), проверка уязвимостей (vuln) и
# кроссплатформенный QA-прогонщик `go run ./qa/runner` на SQLite и на
# PostgreSQL с нагрузочной прикидкой 10⁴ (qa-sqlite/qa-postgres).
#
# Тег `vX.Y.Z`, указывающий на коммит в истории основной ветки, получает
# verify-tag (тег на main, build, vet, gofmt, test) и полный QA-контур того
# же коммита. Кросс-сборка и публикация GitLab Release отключены
# (build/publish — `when: never`): релизные артефакты и GitHub Release
# выпускает GitHub Actions (`.github/workflows/release.yml`).
#
# Переменные QA — те же, что в GitHub-воркфлоу `.github/workflows/`
# (CATALOG_QA_SCALE, CATALOG_QA_DIALECT, CATALOG_TEST_POSTGRES_DSN).
# GitHub-воркфлоу — самостоятельный контур будущего зеркала репозитория
# на GitHub (ci.yml — lint/test пул-реквестов, qa.yml — полный QA
# вручную и как гейт релиза, release.yml — релиз по тегу); до включения
# зеркалирования QA на каждый пуш выполняется только здесь.
#
# Отличия от GitHub-версии:
# - нога QA на Windows не выполняется: в инсталляции только Linux-раннеры
#   с docker-исполнителем, а Windows-раннера нет. Компиляцию под
#   windows/darwin проверяет crossbuild (сборка, но не прогон сценариев) —
#   чтобы зарегистрировать Windows-раннер и вернуть полную матрицу, нужно
#   добавить джобу с `tags: [windows]` и shell-исполнителем;
# - QA на каждый пуш выполняется только здесь: в GitHub-версии полный
#   контур запускается вручную (workflow_dispatch) и на теге релиза
#   (workflow_call) — джоба skip-check (поиск зелёного прогона того же
#   SHA по Actions API) упразднена вместе с автоматическим QA;
# - релизная сборка и публикация отключены (build/publish — `when: never`):
#   артефакты и GitHub Release выпускает GitHub Actions (release.yml).
#
# Требования к раннеру: docker-исполнитель с тегом `docker` (тег задан в
# `default`, поэтому джобы не зависят от настройки «Run untagged jobs»),
# а инстанс-раннеры должны быть включены для проекта
# (Settings → CI/CD → Runners → «Turn on instance runners for this project»).

workflow:
  rules:
    # каждая ветка и каждый MR получают ровно один пайплайн:
    # при открытом MR ветку покрывает пайплайн MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # пайплайн тега — только для релизных тегов vX.Y.Z (маска та же, что в
    # GitHub-версии); прочие теги пайплайна не создают
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - when: never

stages:
  - lint
  - test
  - vuln
  - qa
  - verify
  - build
  - publish

variables:
  GOFLAGS: "-mod=readonly"
  # Go-кэш — внутри каталога проекта: GitLab кэширует только пути внутри
  # $CI_PROJECT_DIR. На проверки это не влияет: gofmt считается по файлам
  # репозитория (стадия static прогонщика и джобы lint/verify-tag), а `.go/`
  # внесён в .gitignore — в список файлов кэш не попадает.

  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/build"

default:
  # Debian-вариант образа: нужны bash (/dev/tcp в ожидании службы), git, apt
  image: golang:1.26
  # Инстанс-раннер не берёт джобы без тегов (Run untagged jobs выключен),
  # поэтому тег задаётся явно: docker-исполнитель с этим тегом.
  tags:
    - docker
  interruptible: true
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .go/bin/
      - .go/build/

# --- QA -------------------------------------------------------------------

lint:
  stage: lint
  script:
    - |
      fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
      if [ -n "$fmt" ]; then
        echo "gofmt требует правки в файлах:"
        echo "$fmt"
        exit 1
      fi
      echo "gofmt: чисто"
    - go vet ./...

test:
  stage: test
  script:
    - go test ./...

crossbuild:
  stage: test
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64; do
        goos="${target%/*}"
        goarch="${target#*/}"
        echo "сборка GOOS=${goos} GOARCH=${goarch}"
        GOOS="$goos" GOARCH="$goarch" go build ./... || exit 1
      done

vuln:
  stage: vuln
  script:
    # версия не пиннится: govulncheck должен понимать текущую версию Go
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - export PATH="$(go env GOPATH)/bin:$PATH" && govulncheck ./...

# Общий контур QA-прогонщика: отчёт текущего прогона выгружается артефактом
# и при отказе тоже. Путь отчёта задаётся явно (-report) — в артефакт
# попадает только он, закоммиченные исторические отчёты не участвуют.
.qa-run:
  stage: qa
  timeout: 60m
  script:
    - |
      set +e
      go run ./qa/runner -report qa-artifact/qa-report.log
      rc=$?
      set -e
      if [ -f qa-artifact/qa-report.log ]; then
        echo "отчёт прогона: qa-artifact/qa-report.log"
      else
        echo "предупреждение: отчёт qa-artifact/qa-report.log не создан"
      fi
      exit "$rc"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa-artifact/

qa-sqlite:
  extends: .qa-run
  variables:
    CATALOG_QA_SCALE: "10000"
    CATALOG_QA_DIALECT: sqlite

qa-postgres:
  extends: .qa-run
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: catalog_test
    CATALOG_TEST_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/catalog_test"
    CATALOG_QA_SCALE: "10000"
    CATALOG_QA_DIALECT: postgres
  before_script:
    # служба стартует асинхронно: ждём открытия порта, а не только контейнера
    - |
      echo "ожидание PostgreSQL…"
      for i in $(seq 1 60); do
        if (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; then
          echo "PostgreSQL готов (попытка $i)"
          exit 0
        fi
        sleep 1
      done
      echo "PostgreSQL не поднялся за 60 с"
      exit 1

# --- Релиз ----------------------------------------------------------------

# Тег обязан указывать на коммит в истории основной ветки: иначе релиз
# собирается из непроверенного коммита.
verify-tag:
  stage: verify
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  script:
    - |
      git fetch --no-tags origin \
        "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/${CI_DEFAULT_BRANCH}"; then
        echo "тег указывает на коммит в истории ${CI_DEFAULT_BRANCH}"
      else
        echo "тег указывает на коммит вне ${CI_DEFAULT_BRANCH} — релиз запрещён"
        exit 1
      fi
    - go build ./... && go vet ./...
    - |
      fmt="$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 -r gofmt -l)"
      if [ -n "$fmt" ]; then
        echo "gofmt требует правки в файлах:"
        echo "$fmt"
        exit 1
      fi
    - go test ./...

build:
  stage: build
  interruptible: false
  # релиз не собирается, пока не зелёный полный QA-контур того же коммита
  needs:
    - verify-tag
    - lint
    - test
    - crossbuild
    - vuln
    - qa-sqlite
    - qa-postgres
  rules:
    # отключено: кросс-сборку релизных артефактов выполняет GitHub Actions
    # (.github/workflows/release.yml). Вернуть — заменить правило на
    # `- if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/`
    - when: never
  parallel:
    matrix:
      - GOOS: [linux, windows, darwin]
        GOARCH: [amd64, arm64]
  variables:
    CGO_ENABLED: "0"
  script:
    - mkdir -p dist
    - |
      bin=catalogctl
      if [ "$GOOS" = windows ]; then
        bin=catalogctl.exe
      fi
      go build -trimpath \
        -ldflags "-s -w -X github.com/billydos/components-catalog/internal/cli.Version=${CI_COMMIT_TAG}" \
        -o "dist/${bin}" ./cmd/catalogctl
      ls -l "dist/${bin}"
    - |
      if [ "$GOOS" = windows ]; then
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends zip >/dev/null
        cd dist && zip -q "catalogctl-${GOOS}-${GOARCH}.zip" catalogctl.exe
      else
        tar -czf "dist/catalogctl-${GOOS}-${GOARCH}.tar.gz" -C dist catalogctl
      fi
  artifacts:
    name: "catalogctl-${GOOS}-${GOARCH}"
    paths:
      - dist/catalogctl-*
    expire_in: 1 week

publish:
  stage: publish
  interruptible: false
  # два одновременных релиза не должны перетирать заметки и ассеты
  resource_group: release
  needs: [build]
  rules:
    # отключено вместе с build: publish потребляет его артефакты и без
    # него в пайплайн не попадает (needs) — GitLab Release выпускает
    # GitHub Actions (.github/workflows/release.yml). Вернуть —
    # восстановить правило тега в build и здесь
    - when: never
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # кэш Go этой джобе не нужен — образ без Go
  cache: {}
  script:
    - |
      cd dist && sha256sum catalogctl-* > checksums.txt && cd ..
      cat dist/checksums.txt
    # заметки — раздел CHANGELOG.md, заголовок которого совпадает с тегом
    - |
      notes="$(awk -v tag="$CI_COMMIT_TAG" \
        'index($0, "## " tag) == 1 {inside = 1; next} inside && /^## / {exit} inside' \
        CHANGELOG.md)"
      if [ -z "$notes" ]; then
        notes="Полный список изменений — CHANGELOG.md в репозитории."
      fi
      description="$(printf 'Релиз %s.\n\n%s' "$CI_COMMIT_TAG" "$notes")"
      printf '%s\n' "$description"
    - |
      set --
      for f in dist/catalogctl-*.tar.gz dist/catalogctl-*.zip dist/checksums.txt; do
        [ -e "$f" ] || continue
        name="${f##*/}"
        url="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/${name}?job=publish"
        set -- "$@" --assets-link "{\"name\":\"${name}\",\"url\":\"${url}\"}"
      done
      release-cli create \
        --name "$CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$description" \
        "$@"
  artifacts:
    # на эти артефакты ссылаются assets релиза — они не должны истекать.
    # Если инсталляция запрещает бессрочные артефакты (настройка
    # «Keep artifacts from expiring» выключена), замените на срок вроде
    # `1 year` — тогда ссылки релиза перестанут работать по его истечении.
    expire_in: never
    paths:
      - dist/
